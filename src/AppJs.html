<script>
(function () {
  'use strict';
  var LB = 0.45359237;
  var S = { date: BOOT.today, unit: BOOT.unit, tab: 'today', today: null, workout: null, meals: null, summary: null, mealSel: null, wk: null };
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var r1 = function (n) { return Math.round(n * 10) / 10; };
  var view = $('#view');
  var timers = [];
  function clearTimers() { timers.forEach(clearInterval); timers = []; }
  function every(fn, ms) { fn(); timers.push(setInterval(fn, ms)); }

  // ---- server call: 1 操作 = 1 回 ----
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }
  var toastT;
  function toast(msg, err) {
    var t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast'; }, err ? 3500 : 1500);
  }
  function fail(e) { toast((e && e.message) || String(e), true); }
  function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p || 200); } catch (e) { /* ignore */ } }

  // ---- units: 保存は kg / 表示は unit ----
  function disp(kg) { if (kg === '' || kg == null || isNaN(Number(kg))) return ''; return S.unit === 'lb' ? r1(Number(kg) / LB) : r1(Number(kg)); }
  function u() { return S.unit; }

  // ---- sheet ----
  function openSheet(html) { var s = $('#sheet'); $('.sheet-body', s).innerHTML = html; s.classList.remove('hidden'); return s; }
  function closeSheet() { $('#sheet').classList.add('hidden'); }
  $('#sheet').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });

  // ---- date ----
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function dObj(ymd) { return new Date(ymd + 'T12:00:00Z'); }
  function md(ymd) { var d = dObj(ymd); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
  function wd(ymd) { return WD[dObj(ymd).getUTCDay()]; }
  function shiftDate(n) { var d = dObj(S.date); d.setUTCDate(d.getUTCDate() + n); S.date = d.toISOString().slice(0, 10); S.today = S.workout = S.meals = null; S.wk = null; S.mealSel = null; render(); }
  function dateLine(extra) {
    return '<p class="date"><button class="nav" data-shift="-1">‹</button><span>' + md(S.date) + ' <b>' + wd(S.date) + '</b>' + (S.date === BOOT.today ? '' : ' <span class="mute" style="font-size:16px">' + (S.date < BOOT.today ? '過去' : '未来') + '</span>') + '</span><button class="nav" data-shift="1">›</button>' + (extra || '') + '</p>';
  }
  function bindDate() { $$('[data-shift]').forEach(function (b) { b.onclick = function () { shiftDate(Number(b.dataset.shift)); }; }); }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }
  function hmMin(hm) { var m = /^(\d{1,2}):(\d{2})$/.exec(hm || ''); return m ? +m[1] * 60 + +m[2] : null; }
  function mmss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2); }

  // ---- tabs ----
  $$('.tabs button').forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
  function go(tab) { S.tab = tab; render(); window.scrollTo(0, 0); }
  function render() {
    clearTimers();
    $$('.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
    ({ today: renderToday, workout: renderWorkout, meals: renderMeals, summary: renderSummary })[S.tab]();
  }
  function updateTabs() {
    if (S.today) {
      $('#tabWorkout').textContent = 'Day ' + S.today.day_no;
      $('#tabMeals').textContent = S.today.next_meal_no + '食目';
    }
  }
  function loadToday() { return call('getToday', S.date).then(function (d) { S.today = d; updateTabs(); return d; }); }

  // ======================= 今日 =======================
  function renderToday() {
    if (!S.today) { view.innerHTML = '<div class="loading">読み込み中…</div>'; return loadToday().then(renderToday).catch(fail); }
    var d = S.today, h = '';
    h += '<h1 class="tap" id="dayHead">Day ' + d.day_no + ' ・ ' + esc(d.day_name) + (d.day_notes ? '（' + esc(d.day_notes) + '）' : '') + (d.is_rest ? ' ・ 休み' : '') + (d.day_override ? ' ・ 手動' : '') + ' ›</h1>';
    h += dateLine();
    h += '<div class="now' + (d.now.kind === 'done' ? ' done' : '') + '" id="now"></div>';
    h += '<div class="tl">';
    d.timeline.forEach(function (st) {
      h += '<div class="step ' + st.state + '" data-step="' + esc(st.id) + '"><div class="row"><span class="tm">' + esc(st.time || '') + '</span><span class="nm" data-open="' + esc(st.id) + '">' + esc(st.name) + '</span><span class="v">' + esc(st.value || '') + '</span><button class="chk' + (st.done ? ' on' : '') + '" data-chk="' + esc(st.id) + '">' + (st.done ? '✓' : '') + '</button></div></div>';
    });
    h += '</div>';
    h += '<div class="card" style="margin-top:16px"><div class="ttl small mute">今日のメモ（週次レポートに載ります）</div><textarea class="txt" id="dayComment" placeholder="体調、違和感など">' + esc(d.comment || '') + '</textarea></div>';
    view.innerHTML = h;
    bindDate();
    $('#dayHead').onclick = openDayPicker;
    renderNow();
    $$('[data-chk]').forEach(function (b) { b.onclick = function () { stepAction(b.dataset.chk, true); }; });
    $$('[data-open]').forEach(function (el) { el.onclick = function () { stepAction(el.dataset.open, false); }; });
    var ta = $('#dayComment'); ta.onblur = function () { if (ta.value === (d.comment || '')) return; d.comment = ta.value; call('saveDailyComment', d.date, ta.value).then(function () { toast('メモを保存'); }).catch(fail); };
  }

  function stepById(id) { return S.today.timeline.filter(function (s) { return s.id === id; })[0]; }
  function refreshToday() { S.today = null; S.meals = null; return loadToday().then(function () { if (S.tab === 'today') renderToday(); }).catch(fail); }

  /** タイムラインの ✔ / 名前タップ。chk=true は「その場で完了」。 */
  function stepAction(id, chk) {
    var st = stepById(id), d = S.today;
    if (!st) return;
    switch (st.kind) {
      case 'weight': openWeightSheet(); break;
      case 'routine': optimisticStep(st, function (next) { return call('toggleRoutine', d.date, st.item_id, next); }); break;
      case 'supp_group':
        if (chk) optimisticStep(st, function (next) { return call('toggleSupplementGroup', d.date, st.id.split(':')[1], next); });
        else openSuppSheet(st); break;
      case 'meal':
        if (chk && !st.done) { call('mealPlanDone', d.date, st.meal_no).then(function () { toast(st.meal_no + '食目 プラン通り'); refreshToday(); }).catch(fail); }
        else { S.mealSel = st.meal_no; go('meals'); } break;
      case 'workout': go('workout'); break;
      case 'cardio': openCardioSheet(); break;
      case 'water': openWaterSheet(); break;
    }
  }
  function optimisticStep(st, fn) {
    var next = !st.done;
    var el = $('[data-step="' + st.id + '"]'), chk = $('.chk', el);
    el.className = 'step ' + (next ? 'done' : 'future'); chk.classList.toggle('on', next); chk.textContent = next ? '✓' : '';
    fn(next).then(function () { refreshToday(); }).catch(function (e) { fail(e); refreshToday(); });
  }

  function renderNow() {
    var d = S.today, n = d.now, el = $('#now');
    if (!el) return;
    var timerLeft = null;
    if (n.timer_until) { var t = hmMin(n.timer_until); if (t != null) timerLeft = (t - nowMin()) * 60; if (timerLeft <= 0) timerLeft = null; }
    var h = '<div class="k">' + (n.kind === 'done' ? '完了' : 'いま') + (n.time ? '<span style="float:right" class="num">' + esc(n.time) + '</span>' : '') + '</div>';
    var title = n.title, sub = n.sub, btn = n.button, btn2 = n.button2;
    if (n.kind === 'meal' && n.timer_until && timerLeft == null) { title = n.meal_no + '食目を食べる'; btn = 'プラン通り食べた'; btn2 = '変更'; var ms = stepById(n.step_id); sub = ms ? ms.name.replace(/^\S+\s*/, '') : ''; }
    if (n.kind !== 'meal' && n.timer_until && timerLeft == null) { title = n.title.replace(/まで$/, ''); sub = ''; }
    h += '<div class="t">' + esc(title) + '</div>';
    if (timerLeft != null) h += '<div class="timer" id="nowTimer">' + mmss(timerLeft) + '</div>';
    if (sub) h += '<div class="s">' + esc(sub) + '</div>';
    if (n.kind === 'weight') {
      h += '<div class="w-in"><input type="number" step="0.1" inputmode="decimal" id="nowW" placeholder="' + (d.prev_weight ? disp(d.prev_weight.weight_kg) : '0.0') + '"><span class="u">' + u() + '</span><input type="number" step="0.1" inputmode="decimal" id="nowBf" class="bf" placeholder="体脂肪"><span class="u">%</span></div>';
    }
    if (n.kind !== 'done') h += '<div class="btns"><button id="nowBtn">' + esc(btn) + '</button>' + (btn2 ? '<button class="alt" id="nowBtn2">' + esc(btn2) + '</button>' : '') + '</div>';
    el.innerHTML = h;
    if (timerLeft != null) {
      every(function () { var t = hmMin(n.timer_until); var left = (t - nowMin()) * 60; var te = $('#nowTimer'); if (!te) return; if (left <= 0) { vibrate([200, 100, 200]); renderNow(); } else te.textContent = mmss(left); }, 1000);
    }
    var b = $('#nowBtn'), b2 = $('#nowBtn2');
    if (!b) return;
    b.onclick = function () {
      switch (n.kind) {
        case 'weight': { var v = $('#nowW').value; if (!v) return toast('体重を入力', true); b.disabled = true; call('saveWeight', d.date, v, S.unit, $('#nowBf').value, '').then(function () { toast('体重を保存'); refreshToday(); }).catch(function (e) { b.disabled = false; fail(e); }); break; }
        case 'routine': stepAction(n.step_id, true); break;
        case 'supp_group': stepAction(n.step_id, true); break;
        case 'meal': if (timerLeft != null) { S.mealSel = n.meal_no; go('meals'); } else stepAction(n.step_id, true); break;
        case 'workout': go('workout'); break;
        case 'cardio': openCardioSheet(); break;
        case 'water': addWater(500); break;
      }
    };
    if (b2) b2.onclick = function () { if (n.kind === 'meal') { S.mealSel = n.meal_no; go('meals'); } else if (n.kind === 'water') addWater(250); };
  }

  function addWater(delta) {
    var d = S.today; d.water_ml = Math.max(0, d.water_ml + delta);
    var wt = $('#waterTxt'); if (wt) wt.textContent = (d.water_ml / 1000).toFixed(2) + ' / ' + (d.water_goal_ml / 1000) + ' L';
    call('addWater', d.date, delta).then(function (res) { d.water_ml = res.water_ml; if (!$('#waterTxt')) refreshToday(); else { wt.textContent = (res.water_ml / 1000).toFixed(2) + ' / ' + (d.water_goal_ml / 1000) + ' L'; } }).catch(function (e) { fail(e); refreshToday(); });
  }
  function openWaterSheet() {
    var d = S.today;
    var s = openSheet('<h3>水</h3><div class="date" style="margin:0 0 10px"><span id="waterTxt">' + (d.water_ml / 1000).toFixed(2) + ' / ' + (d.water_goal_ml / 1000) + ' L</span></div><div class="btns"><button class="b-yel" data-w="250">+250ml</button><button class="b-yel" data-w="500">+500ml</button><button class="b-ghost" data-w="1000">+1L</button><button class="b-ghost" data-w="-250">−250</button></div><button class="b b-sub" style="width:100%;margin-top:10px" id="wClose">閉じる</button>');
    $$('[data-w]', s).forEach(function (b) { b.onclick = function () { addWater(Number(b.dataset.w)); }; });
    $('#wClose', s).onclick = function () { closeSheet(); refreshToday(); };
  }
  function openWeightSheet() {
    var d = S.today;
    var s = openSheet('<h3>体重</h3><div class="w-in"><input type="number" step="0.1" inputmode="decimal" id="shW" value="' + (d.weight ? disp(d.weight.weight_kg) : '') + '" placeholder="' + (d.prev_weight ? disp(d.prev_weight.weight_kg) : '0.0') + '"><span class="u">' + u() + '</span><input type="number" step="0.1" inputmode="decimal" id="shBf" class="bf" value="' + (d.weight ? d.weight.body_fat_pct : '') + '" placeholder="体脂肪"><span class="u">%</span></div>' + (d.prev_weight ? '<div class="mute small" style="margin-top:6px">前回 ' + disp(d.prev_weight.weight_kg) + u() + '（' + esc(d.prev_weight.date.slice(5)) + '）</div>' : '') + '<button class="b b-yel" style="width:100%;margin-top:12px" id="shSave">保存</button>');
    $('#shW', s).focus();
    $('#shSave', s).onclick = function () { var v = $('#shW', s).value; if (!v) return toast('体重を入力', true); call('saveWeight', d.date, v, S.unit, $('#shBf', s).value, '').then(function () { closeSheet(); toast('体重を保存'); refreshToday(); }).catch(fail); };
  }
  function openSuppSheet(st) {
    var d = S.today;
    var s = openSheet('<h3>' + esc(st.name) + '</h3><div class="list">' + st.items.map(function (it) { return '<div class="it"><span>' + esc(it.name) + (it.dose ? ' <span class="mute small">' + esc(it.dose) + '</span>' : '') + '</span><button class="chk' + (it.done ? ' on' : '') + '" data-sid="' + it.id + '">' + (it.done ? '✓' : '') + '</button></div>'; }).join('') + '</div><div class="btns" style="margin-top:12px"><button class="b-main" id="suppAll">全部飲んだ</button><button class="b-sub" id="suppClose">閉じる</button></div>');
    $$('[data-sid]', s).forEach(function (b) {
      b.onclick = function () { var it = st.items.filter(function (x) { return x.id === Number(b.dataset.sid); })[0]; it.done = !it.done; b.classList.toggle('on', it.done); b.textContent = it.done ? '✓' : ''; call('toggleSupplement', d.date, it.id, it.done).catch(fail); };
    });
    $('#suppAll', s).onclick = function () { call('toggleSupplementGroup', d.date, st.id.split(':')[1], true).then(function () { closeSheet(); refreshToday(); }).catch(fail); };
    $('#suppClose', s).onclick = function () { closeSheet(); refreshToday(); };
  }
  function openDayPicker() {
    var d = S.today;
    var h = '<h3>Day を変更</h3><div class="mute small" style="margin-bottom:8px">予定変更で Day を入れ替えた日に。自動判定は Day ' + d.day_no + '</div><div class="chips">';
    d.days.forEach(function (x) { h += '<button' + (x.day_no === d.day_no ? ' class="on"' : '') + ' data-day="' + x.day_no + '">Day ' + x.day_no + ' ' + esc(x.name) + '</button>'; });
    h += '</div><div class="btns" style="margin-top:12px"><button class="b-sub" id="dayAuto">自動判定に戻す</button><button class="b-sub" id="restToggle">' + (d.is_rest ? '休みを解除' : '今日を休みにする') + '</button></div>';
    var s = openSheet(h);
    var done = function () { closeSheet(); S.today = S.workout = null; render(); };
    $$('[data-day]', s).forEach(function (b) { b.onclick = function () { call('setDayOverride', d.date, Number(b.dataset.day), null).then(done).catch(fail); }; });
    $('#dayAuto', s).onclick = function () { call('setDayOverride', d.date, null, null).then(done).catch(fail); };
    $('#restToggle', s).onclick = function () { call('setDayOverride', d.date, d.day_override ? d.day_no : null, !d.is_rest).then(done).catch(fail); };
  }
  function openCardioSheet(after) {
    var s = openSheet('<h3>有酸素を記録</h3><div class="chips" id="cType"><button class="on" data-t="walk">歩き</button><button data-t="jog">ジョグ</button><button data-t="stairs">階段</button><button data-t="other">その他</button></div><label class="lbl">分数</label><div class="w-in"><input type="number" inputmode="numeric" id="cMin" placeholder="40"><span class="u">分</span></div><label class="lbl">メモ</label><input type="text" class="txt" id="cNote"><div class="btns" style="margin-top:12px"><button class="b-sub" id="cSkip">' + (after ? 'あとで' : 'キャンセル') + '</button><button class="b-yel" id="cSave">保存</button></div>');
    var type = 'walk';
    $$('#cType button', s).forEach(function (b) { b.onclick = function () { type = b.dataset.t; $$('#cType button', s).forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    $('#cMin', s).focus();
    $('#cSkip', s).onclick = function () { closeSheet(); if (after) after(); };
    $('#cSave', s).onclick = function () { call('saveCardio', S.date, type, $('#cMin', s).value, $('#cNote', s).value).then(function () { toast('有酸素を保存'); closeSheet(); S.today = S.workout = null; if (after) after(); else render(); }).catch(fail); };
  }
  function openMediaSheet(category, exerciseId, onDone) {
    var cat = category || 'body';
    var s = openSheet('<h3>写真・動画</h3><div class="chips" id="mCat"><button data-c="body"' + (cat === 'body' ? ' class="on"' : '') + '>body 体の変化</button><button data-c="form"' + (cat === 'form' ? ' class="on"' : '') + '>form フォーム</button><button data-c="meal"' + (cat === 'meal' ? ' class="on"' : '') + '>meal</button></div><label class="lbl">ファイル（50MB 目安）</label><input type="file" id="mFile" accept="image/*,video/*" class="txt"><label class="lbl">メモ</label><input type="text" class="txt" id="mNote"><div class="mute small" id="mProg" style="margin-top:6px"></div><button class="b b-yel" style="width:100%;margin-top:10px" id="mUp">アップロード → Drive/TrainingLog/' + S.date.slice(0, 7) + '</button><label class="lbl">大きい動画は Drive アプリで直接アップして URL を貼る</label><div class="row2"><input type="url" class="txt" id="mUrl" placeholder="https://drive.google.com/…"><button class="b b-sub" style="flex:0 0 90px" id="mUrlAdd">登録</button></div>');
    $$('#mCat button', s).forEach(function (b) { b.onclick = function () { cat = b.dataset.c; $$('#mCat button', s).forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    $('#mUp', s).onclick = function () {
      var f = $('#mFile', s).files[0]; if (!f) return toast('ファイルを選択', true);
      if (f.size > 50 * 1024 * 1024) return toast('50MB 超。Drive アプリで直接アップして URL を登録してください', true);
      $('#mUp', s).disabled = true; $('#mProg', s).textContent = '読み込み中… ' + (f.size / 1048576).toFixed(1) + 'MB';
      var reader = new FileReader();
      reader.onload = function () {
        $('#mProg', s).textContent = 'アップロード中…';
        call('uploadMedia', String(reader.result).split(',')[1], f.type || 'application/octet-stream', f.name, { date: S.date, category: cat, exercise_id: exerciseId || '', note: $('#mNote', s).value })
          .then(function () { toast('アップロード完了'); closeSheet(); if (onDone) onDone(); }).catch(function (e) { $('#mUp', s).disabled = false; $('#mProg', s).textContent = ''; fail(e); });
      };
      reader.readAsDataURL(f);
    };
    $('#mUrlAdd', s).onclick = function () { call('addMediaUrl', { date: S.date, drive_url: $('#mUrl', s).value, category: cat, exercise_id: exerciseId || '', note: $('#mNote', s).value, type: 'video' }).then(function () { toast('登録しました'); closeSheet(); if (onDone) onDone(); }).catch(fail); };
  }

  // ======================= 筋トレ（1画面1セット） =======================
  function firstUndone(d) {
    for (var i = 0; i < d.exercises.length; i++) for (var j = 0; j < d.exercises[i].sets.length; j++) if (!d.exercises[i].sets[j].done) return { ex: i, set: j };
    return null;
  }
  function renderWorkout() {
    if (!S.workout) { view.innerHTML = '<div class="loading">読み込み中…</div>'; return Promise.all([call('getWorkout', S.date), S.today ? Promise.resolve(S.today) : loadToday()]).then(function (r) { S.workout = r[0]; var p = firstUndone(r[0]); S.wk = p ? { ex: p.ex, set: p.set } : { ex: 0, set: 0 }; renderWorkout(); }).catch(fail); }
    var d = S.workout, h = '';
    if (d.is_rest || !d.exercises.length) {
      h += '<h1>Day ' + d.day_no + ' ・ ' + esc(d.day_name) + '</h1>' + dateLine();
      h += '<div class="now"><div class="k">今日</div><div class="t">休み ・ 有酸素のみ</div><div class="s">' + (d.cardio.length ? d.cardio.map(function (c) { return c.type + ' ' + c.minutes + '分'; }).join('・') + ' 記録済み' : '歩き・ジョグ・階段を 35〜40 分') + '</div><div class="btns"><button id="rcardio">有酸素を記録</button></div></div>';
      view.innerHTML = h; bindDate();
      $('#rcardio').onclick = function () { openCardioSheet(); };
      return;
    }
    var ex = d.exercises[S.wk.ex], st = ex.sets[S.wk.set];
    var allDone = d.exercises.every(function (e) { return e.sets.every(function (x) { return x.done; }); });
    h += '<div class="ex-head"><h1>Day ' + d.day_no + ' ・ ' + esc(d.day_name) + (S.date === BOOT.today ? '' : ' ・ ' + md(S.date)) + '</h1><span class="p"><button data-ex="-1">‹</button>種目 ' + (S.wk.ex + 1) + ' / ' + d.exercises.length + '<button data-ex="1">›</button></span></div>';
    if (ex.is_preexhaust) h += '<span class="tag">事前疲労</span>';
    else if (S.wk.ex > 0 && d.exercises[S.wk.ex - 1].is_preexhaust) h += '<span class="tag">事前疲労のあと</span>';
    if (ex.superset_group) h += '<span class="tag ss">スーパーセット ' + esc(ex.superset_group) + '</span>';
    if (ex.sub_name) h += '<span class="tag sub">代替: ' + esc(ex.sub_name) + '</span>';
    h += '<p class="ex-name">' + esc(ex.sub_name || ex.name_ja) + '</p>';
    h += '<p class="ex-en">' + esc(ex.name_en) + ' ・ <a href="' + esc(ex.video_url) + '" target="_blank" rel="noopener"><u>動画を見る</u></a>' + (ex.how_to ? ' ・ <u id="howtoBtn">やり方</u>' : '') + '</p>';
    if (ex.how_to) h += '<div class="howto hidden" id="howto">' + esc(ex.how_to) + '</div>';
