<style>
:root{
  --bg:#15171A; --floor:#1C1F23; --card:#23272C; --card2:#2B3036;
  --ink:#F2F1EC; --mute:#8D949D; --line:#33393F;
  --yellow:#F2C300; --yellow-ink:#1A1600; --done:#6FCF8A; --warn:#E5534B;
  --num:"Barlow Condensed","Zen Kaku Gothic New",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0E0F11;color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.5}
body{display:flex;justify-content:center;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.phone{width:100%;max-width:420px;min-height:100vh;background:var(--bg);position:relative;
  background-image:radial-gradient(rgba(255,255,255,.055) .7px,transparent .8px);background-size:7px 7px}
main{padding:18px 16px calc(120px + var(--safe-b))}
h1{font:700 15px var(--jp);color:var(--mute);margin:0 0 2px}
h1.tap{cursor:pointer}
h2{font:700 13px var(--jp);color:var(--mute);margin:18px 0 8px}
.date{font:700 34px/1 var(--num);letter-spacing:.01em;margin:0 0 18px;display:flex;align-items:center;gap:8px}
.date b{color:var(--yellow);font-weight:700}
.date .nav{background:transparent;border:0;color:var(--mute);font:500 26px var(--num);padding:0 6px;line-height:1}
.mute{color:var(--mute)}.small{font-size:13px}.num{font-family:var(--num)}
.hidden{display:none!important}
.loading{text-align:center;color:var(--mute);padding:40px}

/* NOW card */
.now{background:var(--yellow);color:var(--yellow-ink);border-radius:14px;padding:18px 18px 16px;margin-bottom:22px;position:relative;overflow:hidden}
.now.done{background:var(--done);color:#10281A}
.now .k{font-size:13px;font-weight:700;opacity:.75}
.now .t{font:700 26px/1.15 var(--jp);margin:6px 0 4px}
.now .s{font-size:14px;opacity:.85}
.now .timer{font:700 54px/1 var(--num);margin:10px 0 4px;letter-spacing:.02em}
.now .btns{display:flex;gap:8px;margin-top:12px}
.now button{width:100%;border:0;border-radius:10px;padding:14px;background:var(--yellow-ink);color:var(--yellow);font:700 17px var(--jp)}
.now.done button{background:#10281A;color:var(--done)}
.now button.alt{background:rgba(26,22,0,.15);color:var(--yellow-ink);flex:0 0 34%}
.now .w-in{background:rgba(26,22,0,.12);margin-top:10px}
.now .w-in input{color:var(--yellow-ink)}
.now .w-in .u{color:rgba(26,22,0,.6)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.step{position:relative;margin-bottom:12px}
.step:before{content:"";position:absolute;left:-23px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--card2);border:2px solid var(--line)}
.step.done:before{background:var(--done);border-color:var(--done)}
.step.cur:before{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 0 4px rgba(242,195,0,.25)}
.step .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card)}
.step.done .row{background:transparent;color:var(--mute)}
.step.done .row .v{color:var(--done)}
.step .tm{font:500 14px var(--num);color:var(--mute);min-width:44px}
.step .nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .v{font:700 16px var(--num);color:var(--mute);white-space:nowrap}
.step.future .row{opacity:.55}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:16px;flex:none;padding:0}
.chk.on{background:var(--done);border-color:var(--done);color:#10281A}

/* weight input */
.w-in{display:flex;align-items:baseline;gap:8px;background:var(--card);border-radius:10px;padding:10px 12px}
.w-in input{background:transparent;border:0;color:var(--ink);font:700 34px var(--num);width:120px;outline:none;padding:0}
.w-in input.bf{width:84px;font-size:22px}
.w-in input::placeholder{color:var(--mute);opacity:.7}
.w-in .u{color:var(--mute)}
.w-in .d{margin-left:auto;font:500 14px var(--num);color:var(--done)}

/* cards & buttons */
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
.card .ttl{font-weight:700}
.items{color:var(--mute);font-size:13px;margin:4px 0 10px}
.btns{display:flex;gap:8px}
.btns button,.b{flex:1;border:0;border-radius:9px;padding:12px;font:700 15px var(--jp)}
.b-main{background:var(--done);color:#10281A}
.b-sub{background:var(--card2);color:var(--ink)}
.b-yel{background:var(--yellow);color:var(--yellow-ink)}
.b-warn{background:transparent;color:var(--warn);border:1px solid var(--line)}
.b-ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:none;padding:8px 12px;font-size:13px;border:0;border-radius:9px;background:var(--card2);color:var(--ink);font-weight:700}
.chips button.on{background:var(--yellow);color:var(--yellow-ink)}
.chips button.ok{color:var(--done)}
.chips button.skip{color:var(--warn)}
input.txt,select.txt,textarea.txt{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:400 14px var(--jp);outline:none}
textarea.txt{min-height:60px}
.row2{display:flex;gap:8px;align-items:center}
.row2 > *{flex:1}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border-bottom:0}
.list .it .m{color:var(--mute);font:500 13px var(--num);white-space:nowrap}
.list .it .x{background:transparent;border:0;color:var(--warn);font-size:18px;padding:0 6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--card2);color:var(--mute)}
.badge.ok{background:rgba(111,207,138,.18);color:var(--done)}
.badge.warn{background:rgba(242,195,0,.18);color:var(--yellow)}
.badge.bad{background:rgba(229,83,75,.18);color:var(--warn)}

/* workout */
.ex-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.ex-head .p{font:500 13px var(--num);color:var(--mute)}
.ex-head .p button{background:transparent;border:0;color:var(--mute);font:700 18px var(--num);padding:0 8px}
.ex-name{font:700 24px/1.2 var(--jp);margin:0 0 2px}
.ex-en{color:var(--mute);font-size:13px;margin-bottom:14px}
.ex-en a,.ex-en u{color:var(--mute);cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--yellow);color:var(--yellow-ink);margin:0 6px 8px 0}
.tag.ss{background:var(--card2);color:var(--ink)}
.tag.sub{background:var(--warn);color:#fff}
.howto{background:var(--card);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute);margin-bottom:12px}
.setlist{display:flex;gap:6px;margin-bottom:16px}
.setlist div{flex:1;text-align:center;padding:7px 0;border-radius:8px;background:var(--card);font:600 13px var(--num);color:var(--mute);cursor:pointer}
.setlist .on{background:var(--yellow);color:var(--yellow-ink)}
.setlist .ok{background:var(--card2);color:var(--done)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big .cell{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center}
.big .lbl{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;padding:0 4px}
.big .lbl i{font-style:normal;color:var(--mute)}
.big .val{font:700 56px/1 var(--num);margin:8px 0;cursor:pointer}
.big .val small{font-size:20px;color:var(--mute)}
.big .val.empty{color:var(--mute)}
.big .pm{display:flex;gap:8px}
.big .pm button{flex:1;border:0;border-radius:10px;padding:14px 0;background:var(--card2);color:var(--ink);font:700 24px var(--num)}
.ghost{color:var(--mute);font-size:13px;text-align:center;margin:-4px 0 14px}
.ghost b{color:var(--ink);font-family:var(--num);font-size:15px}
.done-btn{width:100%;border:0;border-radius:12px;padding:18px;background:var(--yellow);color:var(--yellow-ink);font:700 20px var(--jp)}
.done-btn.green{background:var(--done);color:#10281A}
.rest{background:var(--card);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
.rest .n{font:700 64px/1 var(--num);color:var(--yellow)}
.rest .l{color:var(--mute);font-size:13px}
.rest button{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 16px;font:600 14px var(--jp)}
.mini{display:flex;gap:8px;margin-top:14px}
.mini button{flex:1;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:10px;font:500 13px var(--jp)}
.exnav{display:flex;justify-content:space-between;margin-top:10px}
.exnav button{background:transparent;border:0;color:var(--mute);font:500 13px var(--jp);padding:6px}

/* summary */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border-radius:10px;padding:12px}
.stat .n{font:700 30px/1 var(--num)}
.stat .n span{font-size:16px;color:var(--mute)}
.stat .l{font-size:12px;color:var(--mute);margin-top:4px}
.spark{background:var(--card);border-radius:10px;padding:12px;margin-bottom:14px}
.spark .h{font-size:13px;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between}
.spark svg{width:100%;height:80px;display:block}
.spark .r{display:flex;justify-content:space-between;font:600 14px var(--num);padding:3px 0}
.spark .r.up span:last-child{color:var(--done)}
.spark .r.mute{color:var(--mute)}
.report{background:var(--card2);border-radius:10px;padding:12px;font:500 12px/1.6 ui-monospace,Menlo,monospace;color:var(--mute);white-space:pre-wrap;user-select:all}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:6px 0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--card2);display:block}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;font:500 11px var(--num);padding:2px 6px;background:rgba(0,0,0,.6);color:#fff}

/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:#0E0F11;border-top:1px solid var(--line);padding:8px 6px calc(10px + var(--safe-b));z-index:5}
.tabs button{flex:1;background:transparent;border:0;color:var(--mute);font:600 12px var(--jp);padding:6px 0}
.tabs button.on{color:var(--yellow)}
.tabs button .ic{display:block;font:700 18px var(--num);margin-bottom:2px}
.tabs button .sub{display:block;opacity:.8}

/* toast & sheet */
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--warn);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-body{background:var(--card);width:100%;max-width:420px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.sheet-body h3{margin:0 0 10px;font:700 17px var(--jp)}
.lbl{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.note{font-size:12px;color:var(--mute);margin-top:18px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
</style>
