<style>
  :root {
    --bg: #0f1115; --card: #181b22; --card2: #1f232c; --line: #2a2f3a; --text: #e8eaf0; --muted: #8b93a5;
    --accent: #4f8cff; --ok: #35c46a; --warn: #f0b429; --bad: #ff5c5c; --pre: #f0b429;
    --ss-a: #4f8cff; --ss-b: #b06cff; --ss-c: #35c46a; --ss-d: #ff8c42;
    --radius: 12px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { padding-bottom: calc(64px + var(--safe-b)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: rgba(15,17,21,.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top .date { flex: 1; text-align: center; font-weight: 600; }
  .icon { background: none; border: 0; font-size: 26px; line-height: 1; padding: 0 10px; color: var(--text); }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .small { font-size: 13px; }
  .big { font-size: 22px; font-weight: 700; }
  input[type=number], input[type=text], input[type=url], select, textarea { width: 100%; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--text); }
  input[type=number] { text-align: center; }
  textarea { min-height: 64px; resize: vertical; }
  .btn { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--text); white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #0b1f12; font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn.block { width: 100%; text-align: center; }
  .btn:disabled { opacity: .5; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .dayhead { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: var(--radius); background: linear-gradient(135deg, #1d2a4a, #182033); border: 1px solid #2c3b63; margin-bottom: 12px; }
  .dayhead .d { font-size: 20px; font-weight: 700; }
  .dayhead .rest { color: var(--warn); }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { background: rgba(53,196,106,.15); color: var(--ok); border-color: rgba(53,196,106,.4); }
  .badge.warn { background: rgba(240,180,41,.15); color: var(--warn); border-color: rgba(240,180,41,.4); }
  .badge.bad { background: rgba(255,92,92,.12); color: var(--bad); border-color: rgba(255,92,92,.4); }
  .ind { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: 0; }
  .check .box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
  .check.on .box { background: var(--ok); border-color: var(--ok); color: #0b1f12; }
  .check.on .name { color: var(--muted); text-decoration: line-through; }
  .check .name { flex: 1; }
  .timing { font-size: 12px; color: var(--muted); margin: 8px 0 2px; text-transform: uppercase; letter-spacing: .06em; }
  .bar { height: 10px; background: var(--card2); border-radius: 999px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  .meal { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .meal:last-child { border-bottom: 0; }
  /* workout */
  .ex { border-left: 4px solid transparent; }
  .ex.pre { background: linear-gradient(90deg, rgba(240,180,41,.18), var(--card) 40%); }
  .ex.ss-A { border-left-color: var(--ss-a); } .ex.ss-B { border-left-color: var(--ss-b); }
  .ex.ss-C { border-left-color: var(--ss-c); } .ex.ss-D { border-left-color: var(--ss-d); }
  .ex .title { font-weight: 700; font-size: 17px; }
  .ex .howto { margin: 8px 0; padding: 10px; background: var(--card2); border-radius: 8px; font-size: 14px; }
  .set { display: grid; grid-template-columns: 44px 44px 1fr 68px 60px 40px; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .set:last-of-type { border-bottom: 0; }
  .set .type { font-size: 12px; font-weight: 700; color: var(--muted); }
  .set .type.TOP { color: var(--warn); } .set .type.DROP { color: var(--bad); }
  .set .target { font-size: 13px; color: var(--muted); }
  .set .prev { font-size: 12px; color: var(--muted); text-align: right; opacity: .8; }
  .set .prev.has { text-decoration: underline dotted; cursor: pointer; }
  .set input { padding: 8px 4px; }
  .set .ok { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); font-size: 18px; }
  .set.done .ok { background: var(--ok); border-color: var(--ok); color: #0b1f12; }
  .set.done input { color: var(--muted); }
  /* meals */
  .foodlist { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .food { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .food:last-child { border-bottom: 0; }
  .food.sel { background: rgba(79,140,255,.18); }
  .food .m { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .item { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .item:last-child { border-bottom: 0; }
  .item.plan { color: var(--muted); }
  .tot { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; gap: 6px; }
  .tot .k { font-size: 12px; color: var(--muted); }
  .tot .v { font-size: 18px; font-weight: 700; }
  .tot .d { font-size: 12px; }
  .d.plus { color: var(--warn); } .d.minus { color: var(--accent); }
  /* media */
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--card2); display: block; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; padding: 2px 6px; background: rgba(0,0,0,.6); }
  .thumb .del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.6); border: 0; color: #fff; border-radius: 6px; font-size: 12px; padding: 2px 6px; }
  /* summary */
  svg.chart { width: 100%; height: 180px; display: block; }
  .chart .axis { stroke: var(--line); stroke-width: 1; }
  .chart .lbl { fill: var(--muted); font-size: 10px; }
  .chart .l1 { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart .l2 { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 4 3; }
  .chart .pt { fill: var(--accent); }
  pre.report { white-space: pre-wrap; background: var(--card2); border-radius: 8px; padding: 10px; font-size: 13px; font-family: inherit; user-select: all; }
  /* nav */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: rgba(15,17,21,.97); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); z-index: 5; }
  .tabs button { flex: 1; background: none; border: 0; padding: 12px 0 10px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .tabs button.on { color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%) translateY(20px); background: #2a2f3a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--bad); }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10; display: flex; align-items: flex-end; }
  .sheet.hidden { display: none; }
  .sheet-body { background: var(--card); width: 100%; max-height: 85vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + var(--safe-b)); }
  .loading { text-align: center; color: var(--muted); padding: 40px; }
  .hidden { display: none !important; }
  label.lbl { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
</style>
