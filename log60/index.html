<title>60kgログ</title>
<!--
  70kg → 60kg のためのトレーニング＆食事ログ（単一ファイル・Claude Artifact 版）
  公開時に宣言する capabilities:
    { db: { rules: [ { path: "", read: "owner", write: "owner" } ] } }
  ・db  : 全データ（オーナーのみ読み書き）。固定プランはコード側の定数なので db には入れない
  ・db が null のとき（ローカルで開いた・権限なし）はメモリ上で動き、「保存されません」と出す
  フェーズ2（今回は作らない）: 写真・動画の記録、Telegram Bot からの入力
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=M+PLUS+1:wght@400;500;700&display=swap">
<style>
/* レイアウト: 1カラムのノート。上に固定の日付ヘッダ、下に3タブ。数字は等幅で縦に揃える */
:root{
  --paper:#F1F4F6; --card:#FFFFFF; --rule:#D5DDE3; --ink:#16212B; --ink2:#5A6B79;
  --accent:#0F6E5C; --signal:#B4531A; --bad:#9E2B25; --ok:#0F6E5C;
  --ssa:#2C6BB0; --ssb:#B4531A; --ssc:#73499F;
  --num:"Oswald","Helvetica Neue",Arial,sans-serif;
  --jp:"M PLUS 1","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F151A; --card:#18212A; --rule:#2B3842; --ink:#E7EDF1; --ink2:#95A6B3;
  --accent:#4FC3A1; --signal:#E0914B; --bad:#E0695F; --ok:#4FC3A1; color-scheme:dark;
  --ssa:#6FB2EA; --ssb:#E0914B; --ssc:#B38AE4;
}}
:root[data-theme="dark"]{
  --paper:#0F151A; --card:#18212A; --rule:#2B3842; --ink:#E7EDF1; --ink2:#95A6B3;
  --accent:#4FC3A1; --signal:#E0914B; --bad:#E0695F; --ok:#4FC3A1; color-scheme:dark;
  --ssa:#6FB2EA; --ssb:#E0914B; --ssc:#B38AE4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--jp)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:460px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ヘッダ */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);padding:14px 0 10px;border-bottom:1px solid var(--rule)}
header .wd{font:600 12px var(--jp);letter-spacing:.14em;color:var(--ink2)}
header h1 .dayno{display:inline-block;font:600 13px var(--num);letter-spacing:.04em;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px;padding:2px 8px;margin-right:8px;vertical-align:4px}
header h1{margin:2px 0 0;font:700 25px/1.25 var(--jp);text-wrap:balance}
header h1 .parts{font:500 16px var(--jp);color:var(--ink2);white-space:nowrap}
header .sub{margin-top:3px;font-size:13px;color:var(--ink2)}
header .nav{display:flex;align-items:center;gap:6px;margin-top:8px}
header .nav button{flex:none;border:1px solid var(--rule);background:var(--card);color:var(--ink2);border-radius:8px;width:34px;height:30px;font:600 15px var(--num);padding:0}
header .nav .d{flex:1;text-align:center;font:500 14px var(--jp);font-variant-numeric:tabular-nums;color:var(--ink2)}
header .nav .today{width:auto;padding:0 10px;font:500 12px var(--jp)}

/* 共通 */
h2{margin:24px 0 10px;font:600 13px var(--jp);letter-spacing:.12em;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:12px}
.banner{border-left:3px solid var(--signal);background:color-mix(in srgb,var(--signal) 10%,var(--card));border-radius:0 10px 10px 0;padding:10px 12px;margin:12px 0;font-size:13.5px}
.banner b{color:var(--signal)}
.mode{background:var(--signal);color:#fff;border-radius:8px;padding:8px 11px;margin:12px 0 0;font:500 12.5px/1.45 var(--jp)}
.mute{color:var(--ink2)}
.small{font-size:12.5px}
.empty{color:var(--ink2);font-size:13.5px;padding:10px 0}

/* 種目カード */
.ex{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden}
/* スーパーセット: 2種目で1枚のカード。記号ごとに色を変える */
.ssbox{--ss:var(--ssa);border-color:color-mix(in srgb,var(--ss) 45%,var(--rule))}
.ssbox[data-ss="B"]{--ss:var(--ssb)}
.ssbox[data-ss="C"]{--ss:var(--ssc)}
.sshd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:color-mix(in srgb,var(--ss) 12%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ss) 30%,var(--rule))}
.sshd .sstag{font:700 12px var(--jp);letter-spacing:.06em;color:var(--ss)}
.sshd .splitbtn{margin-left:auto;border:1px solid color-mix(in srgb,var(--ss) 40%,var(--rule));background:var(--card);color:var(--ss);border-radius:8px;padding:5px 9px;font:600 11.5px var(--jp)}
.ssnote{padding:9px 14px 0;font-size:12.5px;color:var(--ss);font-weight:500;overflow-wrap:anywhere}
.sswarn{margin:7px 14px 0;padding:7px 10px;border-radius:8px;background:color-mix(in srgb,var(--signal) 11%,transparent);color:var(--signal);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.ssbox .ex-h{padding-top:8px;padding-bottom:6px}
.ssbox .ex-h+.ex-h{border-top:1px dashed var(--rule);padding-top:10px}
.ssno{display:inline-block;min-width:20px;font:600 14px var(--num);color:var(--ss);margin-right:4px}
.round{border-top:1px solid var(--rule)}
.round .rndh{padding:7px 14px 2px;font:600 11.5px var(--jp);letter-spacing:.08em;color:var(--ss)}
.round .srow{border-bottom:0;padding-top:5px;padding-bottom:7px}
.srow .n.ssn{font:600 15px var(--num);color:var(--ss)}
.ex-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 14px 10px}
.ex-h .nm{grid-column:1;font:700 16px/1.3 var(--jp);overflow-wrap:anywhere}
.ex-h .nmbtn{background:transparent;border:0;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline dotted;text-underline-offset:4px;text-decoration-color:var(--ink2)}
.ex-h .nmbtn[aria-expanded="true"]{text-decoration-style:solid;text-decoration-color:var(--accent)}
.howto{grid-column:1/3;margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--rule);font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.tips{font-size:12.5px;line-height:1.6;padding:11px 14px}
.tips b{color:var(--accent)}
.ex-h .tgt{grid-column:2;grid-row:1;justify-self:end;white-space:nowrap;font:500 14px var(--num);color:var(--ink2)}
.ex-h .meta{grid-column:1/3;font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.ex-h .meta b{color:var(--ink);font-family:var(--num);font-weight:500}
.sug{grid-column:1/3;margin-top:6px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 9%,transparent);font-size:13px}
.sug b{font:600 15px var(--num);color:var(--accent);margin-left:2px}
.sug .why{display:block;margin-top:2px;font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
/* セットごとの手応え。記録した行の下に3つだけ出す */
.srow .feel{grid-column:2/6;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px}
.srow .feel i{font-style:normal;font-size:11.5px;color:var(--ink2);margin-right:2px}
.srow .feel.ask i{color:var(--signal);font-weight:600}
.srow .feel .fc{flex:1 1 0;min-width:0;border:1px solid var(--rule);background:var(--card);color:var(--ink2);border-radius:8px;padding:7px 4px;font:600 12.5px var(--jp)}
.srow .feel.ask .fc{border-color:color-mix(in srgb,var(--signal) 45%,var(--rule))}
.srow .feel .fc.on{color:var(--paper)}
.srow .feel .fc.on.easy{background:var(--accent);border-color:var(--accent)}
.srow .feel .fc.on.ok{background:var(--ok);border-color:var(--ok)}
.srow .feel .fc.on.hard{background:var(--signal);border-color:var(--signal)}
.srow .nsug{grid-column:2/6;margin-top:1px;font-size:11.5px;color:var(--ink2);overflow-wrap:anywhere}
.srow .nsug b{font:600 13px var(--num);color:var(--accent)}
.chip{display:inline-block;font:700 11px var(--jp);letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:color-mix(in srgb,var(--signal) 15%,transparent);color:var(--signal);margin-left:6px;vertical-align:1px}
.chip.ss{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);margin:0 6px 0 0}
.chip.done{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.rows{border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) 12px minmax(0,1fr) 30px;gap:4px 8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule)}
.srow:last-child{border-bottom:0}
.srow .n{font:500 13px var(--num);color:var(--ink2)}
.srow .x{text-align:center;color:var(--ink2);font-size:13px}
.srow input{width:100%;min-width:0;background:transparent;border:0;border-bottom:1.5px solid var(--rule);color:var(--ink);font:500 19px var(--num);padding:3px 2px;text-align:right;outline:none;-moz-appearance:textfield}
.srow input::-webkit-outer-spin-button,.srow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.srow input:focus{border-bottom-color:var(--accent)}
.srow input::placeholder{color:var(--ink2);opacity:.55}
.srow .u{font:500 11px var(--jp);color:var(--ink2);margin-left:3px}
.srow .mk{text-align:right;font-size:15px;color:var(--rule)}
.srow.filled .mk{color:var(--ok)}
.srow .lab{display:flex;align-items:baseline;justify-content:flex-end}
.srow .bwtag{font:500 14px var(--jp);color:var(--ink2);padding-bottom:4px}

/* 有酸素 */
.cardio{display:flex;gap:7px;margin-top:2px}
.cardio.mins{margin-top:8px}
.cardio .cbtn{flex:1 1 0;min-width:0;border:1px solid var(--rule);background:transparent;color:var(--ink2);border-radius:9px;padding:9px 4px;font:600 12.5px var(--jp);line-height:1.3}
.cardio .cbtn small{display:block;font:500 10.5px var(--num);opacity:.8;margin-top:1px}
.cardio .cbtn.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.bal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.bal b{font:600 19px var(--num);color:var(--ink)}

/* 見直しレポート */
.card.hot{border-color:var(--signal);border-width:1.5px}
.rvhd{font-size:13.5px}
.rvbox{margin-top:12px;padding:11px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,transparent);border-left:3px solid var(--accent)}
.rvbox.cut,.rvbox.add{background:color-mix(in srgb,var(--signal) 10%,transparent);border-left-color:var(--signal)}
.rvbox.wait{background:var(--paper);border-left-color:var(--rule)}
.rvbox .t{font:700 15px var(--jp)}
.rvbox .n{font-size:12.5px;color:var(--ink2);margin-top:3px;overflow-wrap:anywhere}
.rvrow{display:grid;grid-template-columns:auto auto;gap:2px 10px;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.rvrow b{justify-self:end;font:600 16px var(--num);color:var(--ink)}
.rvrow .mute{grid-column:1/3;font-size:11.5px;overflow-wrap:anywhere}
.rvrow.photo b{font:600 13px var(--jp);color:var(--signal)}

/* チェックリスト */
.chk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{grid-row:1/3;width:26px;height:26px;border:1.5px solid var(--rule);border-radius:7px;background:transparent;color:transparent;font-size:15px;padding:0;align-self:center}
.chk .box.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.chk .ttl{font-weight:500}
.chk .ttl .lb{font:600 12px var(--jp);letter-spacing:.08em;color:var(--ink2);margin-right:7px}
.chk .kc{justify-self:end;white-space:nowrap;font:500 14px var(--num);color:var(--ink2)}
.chk .it{grid-column:2/4;font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.chk.on .ttl,.chk.on .it{color:var(--ink2)}
.chk .it s{color:var(--ink2);opacity:.7}
.chk .it em{font-style:normal;color:var(--signal);font-weight:500}

/* PFC */
.pfc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.pfc div{min-width:0}
.pfc .v{font:500 20px/1 var(--num)}
.pfc .v s{font-size:12px;color:var(--ink2);text-decoration:none;white-space:nowrap}
.pfc .l{white-space:nowrap;overflow:hidden;text-overflow:clip}
.pfc .l{font-size:11px;color:var(--ink2);letter-spacing:.06em;margin-top:2px}
.meter{height:5px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.full i{background:var(--ok)}
.meter.over i{background:var(--signal)}
.chk.ex-row{cursor:default}
.chk.ex-row .box{border-color:var(--signal);background:var(--signal)}
.chk .it .xbtn{background:transparent;border:0;color:var(--signal);font:500 12.5px var(--jp);padding:0 2px;text-decoration:underline;margin-left:6px}
.txtin{width:100%;min-width:0;background:transparent;border:0;border-bottom:1.5px solid var(--rule);color:var(--ink);font:400 17px var(--jp);padding:5px 2px;outline:none;-moz-appearance:textfield}
.txtin.num{font:500 19px var(--num);text-align:right}
.txtin::-webkit-outer-spin-button,.txtin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.txtin:focus{border-bottom-color:var(--accent)}
.txtin::placeholder{color:var(--ink2);opacity:.5}

/* 体重入力 */
.win{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--rule);padding-bottom:6px}
.win input{flex:1;min-width:0;background:transparent;border:0;font:500 40px/1 var(--num);color:var(--ink);outline:none;padding:0}
.win input::placeholder{color:var(--ink2);opacity:.45}
.win .u{font:500 16px var(--num);color:var(--ink2)}
.row2{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row2>*{flex:1 1 120px;min-width:0}
label.lb{display:block;font-size:11.5px;letter-spacing:.06em;color:var(--ink2);margin-bottom:4px}
.btn{width:100%;border:0;border-radius:10px;padding:13px;font:700 15px var(--jp);background:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink2);font-weight:500;padding:11px}
.btn.sig{background:var(--signal);color:#fff}
.btns{display:flex;gap:8px;margin-top:12px}
.btns>*{flex:1}

/* グラフ */
.chart{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 10px 10px}
.chart svg{width:100%;height:190px;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:8px 4px 0;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:16px;height:0;border-top-width:2px;border-top-style:solid;vertical-align:3px;margin-right:5px}

/* 振り返り */
.streaks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.streaks div{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 10px;text-align:center;min-width:0}
.streaks .v{font:600 32px/1 var(--num);color:var(--accent)}
.streaks .v small{font-size:13px;color:var(--ink2);font-weight:400}
.streaks .l{font-size:11.5px;color:var(--ink2);margin-top:4px}
table.wk{width:100%;border-collapse:collapse;font:500 13.5px var(--num);font-variant-numeric:tabular-nums}
table.wk th{font:600 11px var(--jp);letter-spacing:.06em;color:var(--ink2);text-align:left;padding:5px 6px;border-bottom:1px solid var(--rule)}
table.wk td{padding:7px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.wk td.d{text-align:right}
table.wk td.dn{color:var(--ok)}
table.wk td.up{color:var(--bad)}
table.wk tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}

/* タブ */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5}
nav.tabs{display:flex;justify-content:center;gap:4px;background:var(--card);border-top:1px solid var(--rule);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
/* 休憩タイマー: タブの上に出す。残り時間と次のセット、飛ばすボタン */
.restbar{background:var(--card);border-top:1px solid var(--rule)}
.restbar .rb{max-width:460px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 16px}
.restbar .rbn{font:600 30px/1 var(--num);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.restbar .rbt{min-width:0;font-size:12px;color:var(--ink2);line-height:1.4}
.restbar .rbt b{display:block;font:600 13px var(--jp);color:var(--ink)}
.restbar .rbt span{display:block;overflow-wrap:anywhere}
.restbar button{flex:none;border:1px solid var(--rule);background:transparent;color:var(--ink2);border-radius:8px;padding:8px 12px;font:600 12.5px var(--jp)}
.restbar .rb.over .rbn{font:700 20px var(--jp);color:var(--signal)}
body:has(#restbar:not([hidden])) .wrap{padding-bottom:calc(166px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1 1 0;max-width:150px;background:transparent;border:0;border-radius:9px;color:var(--ink2);font:600 12px var(--jp);padding:8px 0 7px}
nav.tabs button .ic{display:block;font:700 16px var(--jp);margin-bottom:1px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:9px;font-size:13.5px;opacity:0;transition:.18s;pointer-events:none;z-index:9;max-width:88vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <header id="hd"></header>
  <main id="view"></main>
</div>
<div class="bottom">
  <div class="restbar" id="restbar" role="status" hidden></div>
  <nav class="tabs" aria-label="画面切替">
    <button data-tab="today" aria-current="page"><span class="ic">今日</span></button>
    <button data-tab="log"><span class="ic">記録</span></button>
    <button data-tab="review"><span class="ic">振り返り</span></button>
  </nav>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
(function () {
'use strict';
/* ===== 固定プラン（仕様書どおり。db には入れず、ここが唯一の出どころ） ===== */
const LB = 0.45359237;
const WD_JA = ['日', '月', '火', '水', '木', '金', '土'];
// 種目: [名前, 器具, 初期重量kg]。器具で1段階の刻みが変わる
//   smith/bar = +2.5kg（バー込み） ／ db = +2kg（片手） ／ stack = ケーブル・マシンの +1枚（settings.plateKg、既定5kg） ／ bw = 自重
// セット数とレンジは曜日ではなく Day ごとなので DAYS 側に持つ（同じ種目でも Day でレンジが違うものがある）
const EX = {
  incline_smith: ['インクラインスミスプレス', 'smith', 45],
  pullup: ['懸垂', 'bw', 0],
  cable_fly: ['ケーブルフライ', 'stack', 10],
  low_row: ['ローロウ', 'stack', 40],
  smith_squat: ['スミススクワット', 'smith', 60],
  db_bulgarian: ['DBブルガリアンスクワット', 'db', 11],
  sissy_squat: ['シシースクワット', 'bw', 0],
  smith_calf: ['スミスカーフレイズ', 'smith', 60],

 * セットを記入すると自動で始まる。メイン種目（各 Day の1種目目）は2分30秒、それ以外は75秒。
 * 次のセットを記入すると、新しい記録時刻から数え直す（＝リセット）。
 * スーパーセットの①は「休まず②へ」なので休憩を入れない。

/** カード1枚。ふつうの種目は1種目、SS は2種目を1枚にまとめて「1周目・2周目…」で並べる */
function blockHtml(m, b) {
  const rest = b.main && !b.ssLive ? '休憩 2分30秒（メイン種目）' : '休憩 75秒';
  if (!b.ssLive) {
    const e = b.exs[0];
    let h = '<div class="ex' + (b.split ? ' ssbox' : '') + '"' + (b.split ? ' data-ss="' + e.ss + '"' : '') + '>';
    if (b.split) h += '<div class="sshd"><span class="sstag">SS ' + e.ss + ' を分けています</span>' +
      '<button class="splitbtn" data-split="' + e.ss + '">スーパーセットに戻す</button></div>';
    return h + exHeadHtml(e, rest, null) +
      '<div class="rows">' + e.sets.map((s, si) => setRowHtml(e, s, si, null)).join('') + '</div></div>';
  }
  let h = '<div class="ex ssbox" data-ss="' + b.ss + '">';
  h += '<div class="sshd"><span class="sstag">スーパーセット ' + b.ss + '</span>' +
    '<button class="splitbtn" data-split="' + b.ss + '">通常セットに分ける</button></div>';
  h += '<div class="ssnote">' + b.exs.map((e, k) => CIRC[k]).join('→') + ' を休まず続けて、終わったら休憩 75秒</div>';
  // 同じ器具を2種目で使う SS は、混んでいると回せない（指示書の「別の器具どうし」に合わない組み合わせ）
  if (b.exs.length === 2 && !b.exs[0].bw && b.exs[0].kind === b.exs[1].kind)
    h += '<div class="sswarn">' + (b.exs[0].kind === 'db' ? '①と②がどちらもダンベル（可変式1組なので回せません）' : '①と②で同じ器具をつかいます') +
      '。「通常セットに分ける」で1種目ずつに</div>';
  b.exs.forEach((e, k) => { h += exHeadHtml(e, '', k); });
  for (let n = 1; n <= b.rounds; n++) {
    const rows = b.exs.map((e, k) => { const s = e.sets.find(x => x.no === n); return s ? setRowHtml(e, s, e.sets.indexOf(s), k) : ''; }).join('');
    h += '<div class="round"><div class="rndh">' + n + '周目</div>' + rows + '</div>';
  }
  return h + '</div>';
}

/** 体重グラフ: 日々の点（隣り合う日だけ線でつなぐ）＋週平均の線＋目標のライン。
 *  色は style 属性で渡す（SVG の presentation 属性では CSS 変数が解決されない環境があるため） */
function weightChart(pts) {
  if (!pts.length) return '<div class="chart"><div class="empty" style="padding:34px 10px;text-align:center">体重を記録すると、ここに日々の点と週平均の線が出ます</div></div>';
  const W = 440, H = 190, L = 36, R = 12, T = 14, B = 22;
  const from = pts.length > 1 ? pts[0].date : addDays(pts[0].date, -6), to = pts[pts.length - 1].date;
  const span = Math.max(1, diffDays(from, to));
  const goal = Number(ST.settings.goalKg) || 60;
  const vals = pts.map(p => p.kg).concat([goal]);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi - lo < 2) { const mid = (hi + lo) / 2; lo = mid - 1; hi = mid + 1; }
  const realLo = lo, realHi = hi, padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
  const X = d => L + diffDays(from, d) / span * (W - L - R);
  const Y = kg => T + (hi - kg) / (hi - lo) * (H - T - B);
  const TXT = 'style="fill:var(--ink2);font:10px var(--num)"';
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="体重の推移">';
  // 目盛りは実際に届く値だけを書く
  [realHi, r1((realHi + realLo) / 2), realLo].forEach(v => {
    g += '<line x1="' + L + '" y1="' + r1(Y(v)) + '" x2="' + (W - R) + '" y2="' + r1(Y(v)) + '" style="stroke:var(--rule);stroke-width:1"/>';
    g += '<text x="' + (L - 6) + '" y="' + r1(Y(v) + 3.5) + '" text-anchor="end" ' + TXT + '>' + disp(v) + '</text>';
  });
  // 目標のライン
  if (goal > lo && goal < hi) {
    g += '<line x1="' + L + '" y1="' + r1(Y(goal)) + '" x2="' + (W - R) + '" y2="' + r1(Y(goal)) + '" style="stroke:var(--signal);stroke-width:1.5;stroke-dasharray:4 4"/>';
    g += '<text x="' + (W - R) + '" y="' + r1(Y(goal) - 5) + '" text-anchor="end" style="fill:var(--signal);font:500 10px var(--jp)">目標 ' + disp(goal) + unit() + '</text>';
  }
  // 日々の点。欠測日があるところは線をつながない
  let seg = [];
  const flush = () => { if (seg.length > 1) g += '<polyline points="' + seg.join(' ') + '" style="fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linejoin:round"/>'; seg = []; };
  pts.forEach((p, i) => { const prev = pts[i - 1]; if (prev && diffDays(prev.date, p.date) !== 1) flush(); seg.push(r1(X(p.date)) + ',' + r1(Y(p.kg))); });
  flush();
  pts.forEach(p => { g += '<circle cx="' + r1(X(p.date)) + '" cy="' + r1(Y(p.kg)) + '" r="2.6" style="fill:var(--ink2)"/>'; });
  // 週平均の線（週の中日に置く）
  const wa = weeklyAvgs().filter(w => w.n > 0);
  const atX = w => { const mid = addDays(w.from, 3); return r1(X(mid < from ? from : mid > to ? to : mid)); };
  if (wa.length > 1) g += '<polyline points="' + wa.map(w => atX(w) + ',' + r1(Y(w.avg))).join(' ') + '" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round"/>';
  wa.forEach(w => { g += '<circle cx="' + atX(w) + '" cy="' + r1(Y(w.avg)) + '" r="3.4" style="fill:var(--accent)"/>'; });
  // 直近の実測を強調
  const lastP = pts[pts.length - 1];
  g += '<circle cx="' + r1(X(lastP.date)) + '" cy="' + r1(Y(lastP.kg)) + '" r="4.5" style="fill:var(--card);stroke:var(--ink);stroke-width:2"/>';
  g += '<text x="' + r1(X(from)) + '" y="' + (H - 5) + '" ' + TXT + '>' + md(from) + '</text>';
  g += '<text x="' + (W - R) + '" y="' + (H - 5) + '" text-anchor="end" ' + TXT + '>' + md(to) + '</text>';
  g += '</svg>';
  return '<div class="chart">' + g + '<div class="legend">' +
    '<span><i style="border-color:var(--ink2)"></i>日々の体重</span>' +
    '<span><i style="border-color:var(--accent);border-top-width:3px"></i>週平均</span>' +
    '<span><i style="border-color:var(--signal);border-top-style:dashed"></i>目標 ' + disp(goal) + unit() + '</span></div></div>';
}
/** ウエストのミニグラフ（記録した点を順につなぐだけ） */
function waistChart(pts) {
  const W = 440, H = 110, L = 34, R = 12, T = 12, B = 20;
  let lo = Math.min.apply(null, pts.map(p => p.cm)), hi = Math.max.apply(null, pts.map(p => p.cm));
  if (hi - lo < 2) { const mid = (hi + lo) / 2; lo = mid - 1; hi = mid + 1; }
  const rlo = lo, rhi = hi, pad = (hi - lo) * 0.18; lo -= pad; hi += pad;
  const X = i => L + (pts.length < 2 ? 0.5 : i / (pts.length - 1)) * (W - L - R);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const TXT = 'style="fill:var(--ink2);font:10px var(--num)"';
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="ウエストの推移" style="height:110px">';
  [rhi, rlo].forEach(v => { g += '<line x1="' + L + '" y1="' + r1(Y(v)) + '" x2="' + (W - R) + '" y2="' + r1(Y(v)) + '" style="stroke:var(--rule);stroke-width:1"/>' +
    '<text x="' + (L - 6) + '" y="' + r1(Y(v) + 3.5) + '" text-anchor="end" ' + TXT + '>' + v + '</text>'; });
  g += '<polyline points="' + pts.map((p, i) => r1(X(i)) + ',' + r1(Y(p.cm))).join(' ') + '" style="fill:none;stroke:var(--signal);stroke-width:2.5;stroke-linejoin:round"/>';
  pts.forEach((p, i) => { g += '<circle cx="' + r1(X(i)) + '" cy="' + r1(Y(p.cm)) + '" r="3.2" style="fill:var(--signal)"/>'; });
  g += '<text x="' + L + '" y="' + (H - 4) + '" ' + TXT + '>' + md(pts[0].date) + '</text>';
  g += '<text x="' + (W - R) + '" y="' + (H - 4) + '" text-anchor="end" ' + TXT + '>' + md(pts[pts.length - 1].date) + '</text></svg>';
  return '<div class="chart" style="margin-top:12px;padding:10px 10px 6px">' + g + '</div>';
}

  h += '<div class="small mute" style="margin-top:8px">トレは「Day7 か、その日に記録がある」で数えます（Day が進む条件と同じ）。今日がまだなら前日から数えます</div>';

  // 見直しレポート（疲労抜きサイクルの初日に出すもの。それ以外の日も読めるようにしておく）
  { const rp = reviewReport(today), isDay = isReviewDay(today), nx = isDay ? '' : nextReviewDay(today);
    h += '<h2>見直しレポート</h2>';
    h += '<div class="card' + (isDay ? ' hot' : '') + '">';
    h += '<div class="rvhd">' + (isDay ? '<b>今日は見直しの日</b>（疲労抜きサイクル ' + cycleNoFor(today) + ' の初日）' :
      '次の見直しは <b>' + (nx ? md(nx) : '—') + '</b>（疲労抜きサイクルの初日）') + '</div>';
    h += '<div class="small mute" style="margin-top:4px">' + md(rp.from) + ' 〜 ' + md(rp.to) + ' の ' + REVIEW_SPAN + '日ぶんで見ています</div>';
    h += '<div class="rvbox ' + rp.verdict.kind + '"><div class="t">' + esc(rp.verdict.title) + '</div><div class="n">' + esc(rp.verdict.note) + '</div>' +
      (rp.verdict.delta ? '<div class="btns"><button class="btn sig" id="rvGo">ご飯を ' + (rp.verdict.delta > 0 ? '+' : '') + rp.verdict.delta + 'g 反映する</button></div>' : '') + '</div>';
    h += '<div class="scroll" style="margin-top:12px"><table class="wk"><tr><th>主要種目</th><th>前</th><th>いま</th><th>差</th></tr>' +
      rp.lifts.map(x => x.none ? '<tr><td>' + esc(x.name) + '</td><td colspan="3" class="mute">記録なし</td></tr>'
        : '<tr><td>' + esc(x.name) + '</td><td class="d">' + (x.bw ? x.a + '回' : disp(x.a) + unit()) + '</td>' +
          '<td class="d">' + (x.bw ? x.b + '回' : disp(x.b) + unit()) + '</td>' +
          '<td class="d ' + (x.delta > 0 ? 'dn' : x.delta < 0 ? 'up' : '') + '">' + (x.same ? '<span class="mute">1回だけ</span>' : (x.delta > 0 ? '+' : '') + (x.bw ? x.delta + '回' : disp(x.delta) + unit())) + '</td></tr>').join('') +
      '</table></div>';
    h += '<div class="rvrow"><span>週平均体重</span><b>' + (rp.wDelta == null ? '—' : (rp.wDelta > 0 ? '+' : '') + disp(rp.wDelta) + unit()) + '</b>' +
      '<span class="mute">' + (rp.wa && rp.wb && rp.wDelta != null ? 'Week ' + rp.wa.week + ' ' + disp(rp.wa.avg) + ' → Week ' + rp.wb.week + ' ' + disp(rp.wb.avg) : '週平均が2週ぶん必要です') + '</span></div>';
    h += '<div class="rvrow"><span>ウエスト</span><b>' + (rp.cDelta == null ? '—' : (rp.cDelta > 0 ? '+' : '') + rp.cDelta + 'cm') + '</b>' +
      '<span class="mute">' + (rp.ca && rp.cb && rp.cDelta != null ? md(rp.ca.date) + ' ' + rp.ca.cm + 'cm → ' + md(rp.cb.date) + ' ' + rp.cb.cm + 'cm' : '記録タブで2回以上測ると出ます') + '</span></div>';
    h += '<div class="rvrow photo"><span>写真</span><b>' + (rp.photo ? '今週は撮る週' : 'Week ' + rp.nextPhotoWeek) + '</b>' +
      '<span class="mute">4週ごとに、同じ場所・同じ光で正面・横・後ろ（保存はフェーズ2なので端末に残してください）</span></div>';
    h += '</div>'; }

  h += '<h2>ご飯の調整</h2>';
  if (sug.kind === 'none') {
    h += '<div class="card"><div style="font:700 15px var(--jp)">いまは変えなくてよい</div><div class="small mute" style="margin-top:6px">' + esc(sug.why) + '</div></div>';
  } else {
    h += '<div class="banner"><b>ご飯を各食 ' + (sug.delta > 0 ? '+' : '') + sug.delta + 'g</b><div class="small mute" style="margin-top:4px">' + esc(sug.why) + '</div>' +
      '<div class="btns"><button class="btn sig" id="riceGo">この提案を反映する</button></div></div>';
  }
  const adj = Number(ST.settings.riceAdjustG) || 0;
  h += '<div class="card"><div class="small">いまのご飯: 昼・夕 各 <b class="num">' + (150 + adj) + 'g</b>' + (adj ? '（基準 150g から ' + (adj > 0 ? '+' : '') + adj + 'g）' : '（基準どおり）') + '</div>' +
    '<div class="small mute" style="margin-top:4px">1日の目標は ' + fmtN(sumMac(mealsNow()).kcal) + 'kcal ・ P' + Math.round(sumMac(mealsNow()).p) + ' F' + Math.round(sumMac(mealsNow()).f) + ' C' + Math.round(sumMac(mealsNow()).c) + '</div>' +
    (adj ? '<div class="btns"><button class="btn ghost" id="riceReset">基準の150gに戻す</button></div>' : '') + '</div>';

  h += '<h2>週平均体重</h2><div class="card">';
  if (!wa.length) h += '<div class="empty">体重を記録すると、週ごとの平均と増減が出ます</div>';
  else {
    h += '<div class="scroll"><table class="wk"><tr><th>週</th><th>期間</th><th>週平均</th><th>前週比</th><th>測定</th></tr>' +
      wa.map((w, i) => { const d = i > 0 ? r1(w.avg - wa[i - 1].avg) : null;
        return '<tr><td>' + w.week + '</td><td>' + md(w.from) + '–' + md(w.to) + (w.done ? '' : ' <span class="mute">途中</span>') + '</td>' +
          '<td class="d">' + disp(w.avg) + unit() + '</td>' +
          '<td class="d ' + (d == null ? '' : d < 0 ? 'dn' : d > 0 ? 'up' : '') + '">' + (d == null ? '—' : (d > 0 ? '+' : '') + disp(d) + unit()) + '</td>' +
          '<td class="d">' + w.n + '日</td></tr>'; }).join('') + '</table></div>';
    h += '<div class="small mute" style="margin-top:8px">週は開始日から7日区切り（Day のサイクルとは別）。前週比は終わった週どうしで比べています</div>';
  }
  h += '</div>';

  h += '<h2>サイクルと疲労抜き</h2><div class="card">';
  const cy = cycleNoFor(today), dn = dayNoFor(today), nd = nextDeloadCycle(cy);
  h += '<div class="small">いまは <b class="num">サイクル ' + cy + ' の Day ' + dn + '</b>' + (DAYS[dn] ? '（' + esc(DAYS[dn].name) + '）' : '') + '</div>';
  h += '<div class="small mute" style="margin-top:6px">' + (isDeloadCycle(cy) ? '<b>このサイクルが疲労抜き</b>。セット数を半分にします' :
    '次の疲労抜きは <b class="num">サイクル ' + nd + '</b>（7日サイクルを5回こなすごとに1サイクル）') + '</div>';
  { const a = assignOf(today);
    h += '<div class="small mute" style="margin-top:6px">' + (a.misses >= 2 ? 'このサイクルの未記録は ' + a.misses + ' 回。前借りできる休みがもうないので、以降は1日ずつ後ろにずれます'
      : a.misses === 1 ? 'このサイクルの未記録は1回。休み（Day 7）を前借りで消化するので、全体の日程はずれません'
      : '未記録なし。予定どおり進んでいます') + '</div>'; }
  h += '<div class="small mute" style="margin-top:6px">記録しなかった日はその Day が翌日に持ち越され、そのサイクルの休みを1回ぶん前借りして埋めます</div></div>';

  h += '<h2>設定</h2><div class="card">' +
    '<div class="row2"><div><label class="lb" for="sdIn">開始日</label><input id="sdIn" class="num" type="date" value="' + esc(ST.settings.startDate || '') + '" style="width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--rule);padding:4px 0;font-size:17px"></div>' +
    '<div><label class="lb" for="goalIn">目標体重（' + unit() + '）</label><div class="win"><input id="goalIn" type="number" inputmode="decimal" step="any" min="0" style="font-size:22px" value="' + esc(disp(Number(ST.settings.goalKg) || 60)) + '"><span class="u">' + unit() + '</span></div></div></div>' +
    '<div class="row2" style="margin-top:14px"><div><label class="lb" for="plateIn">ケーブル・マシンの1枚（kg）</label><div class="win"><input id="plateIn" type="number" inputmode="decimal" step="any" min="0.5" style="font-size:22px" value="' + esc(plateKg()) + '"><span class="u">kg</span></div></div></div>' +
    '<div style="margin-top:14px"><label class="lb" for="dialIn">ダンベルのダイヤル（片手・kg／カンマ区切り）</label>' +
    '<input id="dialIn" class="txtin" type="text" inputmode="numeric" value="' + esc(dbDial().join(', ')) + '"></div>' +
    '<div class="btns"><button class="btn" id="setSave">保存する</button></div>' +
    '<div class="btns"><button class="btn ghost" id="soundBtn">休憩おわりの音を ' + (ST.settings.soundOn === false ? 'オンにする' : 'オフにする') + '</button></div>' +
    '<div class="btns"><button class="btn ghost" id="unitBtn2">単位を ' + (unit() === 'kg' ? 'lb' : 'kg') + ' に切り替える</button></div>' +
    '<div class="small mute" style="margin-top:10px">開始日は Day のサイクルと週平均の起点です。「1枚」はケーブル・マシンの1段階ぶん。ダイヤルは可変式ダンベルの目盛りで、DB の重量提案はこの数字に丸めます。開始日が空のままだと一番古い記録の日を使います' +
    (ST.settings.startDate ? '' : '（いま ' + md(startDate()) + '）') + '</div></div>';

  h += '<div class="card"><div class="small mute">写真・動画の記録と Telegram Bot からの入力はフェーズ2。このアプリにはまだありません</div></div>';

  $('#view').innerHTML = h;
  const go = $('#riceGo'); if (go) go.onclick = () => { saveSettings({ riceAdjustG: adj + sug.delta }); toast('ご飯を各食 ' + (adj + sug.delta > 0 ? '+' : '') + (adj + sug.delta) + 'g にしました'); };
  const rv = $('#rvGo'); if (rv) rv.onclick = () => { const dl = reviewReport(today).verdict.delta || 0;
    saveSettings({ riceAdjustG: adj + dl }).then(() => toast('ご飯を各食 ' + (adj + dl > 0 ? '+' : '') + (adj + dl) + 'g にしました')); };
  const rr = $('#riceReset'); if (rr) rr.onclick = () => { saveSettings({ riceAdjustG: 0 }); toast('ご飯を基準の150gに戻しました'); };
  $('#setSave').onclick = () => { const sd = $('#sdIn').value, g = $('#goalIn').value.trim(), pl = $('#plateIn').value.trim(), dl = $('#dialIn').value;
    $('#sdIn').blur(); $('#goalIn').blur(); $('#plateIn').blur(); $('#dialIn').blur(); pendingRender = false;
    if (sd && !/^\d{4}-\d{2}-\d{2}$/.test(sd)) return toast('開始日の形式が読めません');
    const dial = dl.split(/[^0-9.]+/).map(Number).filter(n => n > 0).sort((a, b) => a - b);
    if (dl.trim() !== '' && dial.length < 2) return toast('ダイヤルは2つ以上の数字で入れてください');
    saveSettings({ startDate: sd || '', goalKg: g === '' ? 60 : toKg(g), plateKg: Number(pl) > 0 ? r1(Number(pl)) : 5,
      dbDial: dial.length >= 2 ? dial.join(',') : '' }).then(() => toast('設定を保存しました')); };
  $('#soundBtn').onclick = () => { const on = ST.settings.soundOn === false; if (on) primeAudio(); saveSettings({ soundOn: on }).then(() => toast('休憩おわりの音を ' + (on ? 'オン' : 'オフ') + ' にしました')); };
  $('#unitBtn2').onclick = () => saveSettings({ unit: unit() === 'kg' ? 'lb' : 'kg' });
}

document.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender && !typing()) render(); }, 0); });
/* ===== 起動（db の返事を待たずに画面を出し、来たら差し替える） ===== */
$$('nav.tabs button').forEach(b => { b.onclick = () => { UI.tab = b.dataset.tab; if (UI.tab === 'today') UI.date = UI.date || todayYmd(); window.scrollTo(0, 0); render(); }; });
render();
(async () => {
  try { await store.init(); } catch (e) { console.error('起動に失敗', e); ST.mode = 'mock'; }
  finally { if (ST.mode === 'loading') ST.mode = 'mock'; render(); }
})();
// テスト用フック（純粋関数だけ）
window.__log60 = { ST, EX, DAYS, DB_DIAL, dbDial, dialStep, dialFloor, stepUpBy, stepDownBy, cutBy, stepText, CARDIO, CARDIO_MIN, RICE_KCAL_PER_G, blocksOf, splitOf, cardioOf, cardioKcal, cardioOn, cardioStreak, weightAt, burnKcal, cardioRice, waistPoints, waistThisWeek, reviewReport, isReviewDay, nextReviewDay, MAIN_IDS, HOWTO, HOWTO_COMMON, FEELS, nextSetSug, restState, paintRest, REST_MAIN_SEC, REST_OTHER_SEC, prescOn, basePresc, progression, sessionOf, rirOf, stepOf, plateKg, weekNoOf, isDeload, isDeloadCycle, nextDeloadCycle, setsFor, dayNoFor, cycleNoFor, assignOf, recordedOn, extrasOf, riceSuggestion, weeklyAvgs, mealsNow, sumMac, streak, trainedOn, dietOn, suppOn, hitTop, dayModel, lastSession, disp, toKg, rerender: render };
})();
</script>
