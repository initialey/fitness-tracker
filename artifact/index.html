<title>トレログ</title>
<!--
  トレーニング記録アプリ（Claude Artifact 版・単一ファイル）
  公開時に宣言する capabilities:
    { db: { rules: [ { path: "", read: "owner", write: "owner" } ] }, assets: {}, sample: {}, downloads: true }
  ・db      : 全データ（オーナーのみ読み書き）。`user` capability が使えないため data/users/<uid> ではなく
              ルート直下のコレクションを rules でオーナー専用にしている（TODO: user が使えるようになったら移行）
  ・assets  : 写真・動画。db には id を保存し、表示は "/_blob/" + id
  ・sample  : AI 栄養推定（foods に無い食品）。null / 拒否時は手入力にフォールバック
  ・downloads: CSV エクスポート。null なら非表示
  db が null のとき（ローカルで開いた・権限なし）はメモリ上のモックで動く。
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#15171A; --card:#23272C; --card2:#2B3036; --ink:#F2F1EC; --mute:#8D949D; --line:#33393F;
  --yellow:#F2C300; --yellow-ink:#1A1600; --done:#6FCF8A; --warn:#E5534B;
  --num:"Barlow Condensed","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:#0E0F11;color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.5;height:100%}
body{display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.phone{width:100%;max-width:420px;min-height:100%;background:var(--bg);position:relative;
  background-image:radial-gradient(rgba(255,255,255,.055) .7px,transparent .8px);background-size:7px 7px}
main{padding:18px 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1{font:700 15px var(--jp);color:var(--mute);margin:0 0 2px;text-wrap:balance}
h1.tap{cursor:pointer}
.date{font:700 34px/1 var(--num);letter-spacing:.01em;margin:0 0 18px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.date b{color:var(--yellow);font-weight:700}
.date .nav{background:transparent;border:0;color:var(--mute);font:500 26px var(--num);padding:0 6px;line-height:1}
.mute{color:var(--mute)}.small{font-size:13px}.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.loading{text-align:center;color:var(--mute);padding:40px}
/* いま */
.now{background:var(--yellow);color:var(--yellow-ink);border-radius:14px;padding:18px 18px 16px;margin-bottom:22px;position:relative;overflow:hidden}
.now.done{background:var(--done);color:#10281A}
.now .k{font-size:13px;font-weight:700;opacity:.75;display:flex;justify-content:space-between}
.now .t{font:700 26px/1.15 var(--jp);margin:6px 0 4px}
.now .s{font-size:14px;opacity:.85}
.now .timer{font:700 54px/1 var(--num);margin:10px 0 4px;letter-spacing:.02em}
.now .btns{display:flex;gap:8px;margin-top:12px}
.now button{width:100%;border:0;border-radius:10px;padding:14px;background:var(--yellow-ink);color:var(--yellow);font:700 17px var(--jp)}
.now.done button{background:#10281A;color:var(--done)}
.now button.alt{background:rgba(26,22,0,.15);color:var(--yellow-ink);flex:0 0 34%}
.now .w-in{background:rgba(26,22,0,.12);margin-top:10px}
.now .w-in input{color:var(--yellow-ink)}
.now .w-in .u,.now .w-in input::placeholder{color:rgba(26,22,0,.55)}
/* タイムライン */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.step{position:relative;margin-bottom:12px}
.step:before{content:"";position:absolute;left:-23px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--card2);border:2px solid var(--line)}
.step.done:before{background:var(--done);border-color:var(--done)}
.step.cur:before{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 0 4px rgba(242,195,0,.25)}
.step .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card)}
.step.done .row{background:transparent;color:var(--mute)}
.step.done .row .v{color:var(--done)}
.step .tm{font:500 14px var(--num);color:var(--mute);min-width:44px}
.step .nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .v{font:700 16px var(--num);color:var(--mute);white-space:nowrap}
.step.future .row{opacity:.55}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:16px;flex:none;padding:0}
.chk.on{background:var(--done);border-color:var(--done);color:#10281A}
/* 体重入力 */
.w-in{display:flex;align-items:baseline;gap:8px;background:var(--card);border-radius:10px;padding:10px 12px}
.w-in input{background:transparent;border:0;color:var(--ink);font:700 34px var(--num);width:120px;outline:none;padding:0;min-width:0}
.w-in input.bf{width:84px;font-size:22px}
.w-in .u{color:var(--mute)}
.w-in input::placeholder{color:var(--mute);opacity:.7}
/* カード・ボタン */
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
.card .ttl{font-weight:700}
.items{color:var(--mute);font-size:13px;margin:4px 0 10px}
.btns{display:flex;gap:8px}
.btns button,.b{flex:1;border:0;border-radius:9px;padding:12px;font:700 15px var(--jp)}
.b-main{background:var(--done);color:#10281A}
.b-sub{background:var(--card2);color:var(--ink)}
.b-yel{background:var(--yellow);color:var(--yellow-ink)}
.b-ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:none;padding:8px 12px;font-size:13px;border:0;border-radius:9px;background:var(--card2);color:var(--ink);font-weight:700}
.chips button.on{background:var(--yellow);color:var(--yellow-ink)}
.chips button.ok{color:var(--done)}
.chips button.skip{color:var(--warn)}
input.txt,select.txt,textarea.txt{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:400 14px var(--jp);outline:none}
input.txt:focus,textarea.txt:focus,button:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
textarea.txt{min-height:60px}
.row2{display:flex;gap:8px;align-items:center}
.row2 > *{flex:1}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border-bottom:0}
.list .it .m{color:var(--mute);font:500 13px var(--num);white-space:nowrap}
.list .it .x{background:transparent;border:0;color:var(--warn);font-size:18px;padding:0 6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--card2);color:var(--mute)}
.badge.ok{background:rgba(111,207,138,.18);color:var(--done)}
.badge.warn{background:rgba(242,195,0,.18);color:var(--yellow)}
.badge.bad{background:rgba(229,83,75,.18);color:var(--warn)}
/* 筋トレ */
.ex-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.ex-head .p{font:500 13px var(--num);color:var(--mute);white-space:nowrap}
.ex-head .p button{background:transparent;border:0;color:var(--mute);font:700 18px var(--num);padding:0 8px}
.ex-name{font:700 24px/1.2 var(--jp);margin:0 0 2px}
.ex-en{color:var(--mute);font-size:13px;margin-bottom:14px}
.ex-en a,.ex-en u{color:var(--mute);cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--yellow);color:var(--yellow-ink);margin:0 6px 8px 0}
.tag.ss{background:var(--card2);color:var(--ink)}
.tag.sub{background:var(--warn);color:#fff}
.howto{background:var(--card);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute);margin-bottom:12px}
.setlist{display:flex;gap:6px;margin-bottom:16px}
.setlist div{flex:1;text-align:center;padding:7px 0;border-radius:8px;background:var(--card);font:600 13px var(--num);color:var(--mute);cursor:pointer}
.setlist .on{background:var(--yellow);color:var(--yellow-ink)}
.setlist .ok{background:var(--card2);color:var(--done)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big .cell{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center}
.big .lbl{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;padding:0 4px}
.big .lbl i{font-style:normal}
.big .val{font:700 56px/1 var(--num);margin:8px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.big .val.empty{color:var(--mute)}
.big .pm{display:flex;gap:8px}
.big .pm button{flex:1;border:0;border-radius:10px;padding:14px 0;background:var(--card2);color:var(--ink);font:700 24px var(--num)}
.ghost{color:var(--mute);font-size:13px;text-align:center;margin:-4px 0 14px}
.ghost b{color:var(--ink);font-family:var(--num);font-size:15px}
.done-btn{width:100%;border:0;border-radius:12px;padding:18px;background:var(--yellow);color:var(--yellow-ink);font:700 20px var(--jp)}
.done-btn.green{background:var(--done);color:#10281A}
.rest{background:var(--card);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
.rest .n{font:700 64px/1 var(--num);color:var(--yellow);font-variant-numeric:tabular-nums}
.rest .l{color:var(--mute);font-size:13px}
.rest button{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 16px;font:600 14px var(--jp)}
.mini{display:flex;gap:8px;margin-top:14px}
.mini button{flex:1;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:10px;font:500 13px var(--jp)}
/* 週 */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border-radius:10px;padding:12px}
.stat .n{font:700 30px/1 var(--num);font-variant-numeric:tabular-nums}
.stat .n span{font-size:16px;color:var(--mute)}
.stat .l{font-size:12px;color:var(--mute);margin-top:4px}
.spark{background:var(--card);border-radius:10px;padding:12px;margin-bottom:14px}
.spark .h{font-size:13px;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between}
.spark svg{width:100%;height:80px;display:block}
.spark .r{display:flex;justify-content:space-between;font:600 14px var(--num);padding:3px 0}
.spark .r.up span:last-child{color:var(--done)}
.spark .r.mute{color:var(--mute)}
.report{background:var(--card2);border-radius:10px;padding:12px;font:500 12px/1.6 ui-monospace,Menlo,monospace;color:var(--mute);white-space:pre-wrap;user-select:all}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:6px 0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--card2);display:block}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;font:500 11px var(--num);padding:2px 6px;background:rgba(0,0,0,.6);color:#fff}
/* タブ */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:#0E0F11;border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;background:transparent;border:0;color:var(--mute);font:600 12px var(--jp);padding:6px 0}
.tabs button.on{color:var(--yellow)}
.tabs button .ic{display:block;font:700 18px var(--num);margin-bottom:2px}
.tabs button .sub{display:block;opacity:.8}
/* トースト・シート */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--warn);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet-body{background:var(--card);width:100%;max-width:420px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-body h3{margin:0 0 10px;font:700 17px var(--jp)}
.lbl{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.note{font-size:12px;color:var(--mute);margin-top:18px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.mode{font-size:11px;color:var(--mute);text-align:center;margin:-8px 0 12px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<div class="phone">

</div>

/* =====================================================================
   2. 純粋関数（日付・単位・set_scheme・栄養）
   ===================================================================== */
const r1 = n => Math.round(n * 10) / 10;
const pad2 = n => ('0' + n).slice(-2);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ymdLocal(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayYmd() { return ymdLocal(new Date()); }
function nowHm() { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function parseYmd(ymd) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd); return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)); }
function addDays(ymd, n) { const d = parseYmd(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function calcDayNo(start, date) { return ((diffDays(start, date) % 7) + 7) % 7 + 1; }
function calcWeekNo(start, date) { return Math.floor(diffDays(start, date) / 7) + 1; }
function weekRange(start, wk) { const s = addDays(start, (wk - 1) * 7); return { start: s, end: addDays(s, 6) }; }
function md(ymd) { const d = parseYmd(ymd); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
function wd(ymd) { return WD[parseYmd(ymd).getUTCDay()]; }
function hmMin(hm) { const m = /^(\d{1,2}):(\d{2})$/.exec(hm || ''); return m ? +m[1] * 60 + +m[2] : null; }
function minHm(min) { min = ((min % 1440) + 1440) % 1440; return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + pad2(sec % 60); }
function shortRange(s, e) {
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const a = parseYmd(s), b = parseYmd(e);
  return M[a.getUTCMonth()] + ' ' + a.getUTCDate() + '–' + (a.getUTCMonth() === b.getUTCMonth() ? '' : M[b.getUTCMonth()] + ' ') + b.getUTCDate();
}
// 単位: 保存は kg、表示は unit
function disp(kg) { if (kg === '' || kg == null || isNaN(Number(kg))) return ''; return ST.settings.unit === 'lb' ? r1(Number(kg) / LB) : r1(Number(kg)); }
function toKg(v) { const n = Number(v); if (v === '' || isNaN(n)) return ''; return ST.settings.unit === 'lb' ? r1(n * LB) : r1(n); }
const unit = () => ST.settings.unit;

/** 'WU10-12,TOP6-8,BO10-12' / 'MAIN10-12x3,DROP10-12' → [{setNo,setType,min,max}] */
function parseSetScheme(scheme) {
  const out = []; let no = 1;
  String(scheme || '').split(',').forEach(raw => {
    const p = raw.trim(); if (!p) return;
    const m = /^([A-Za-z]+)\s*(\d+)(?:\s*-\s*(\d+))?(?:\s*x\s*(\d+))?$/i.exec(p);
    if (!m) return;
    const count = m[4] ? +m[4] : 1;
    for (let i = 0; i < count; i++) out.push({ setNo: no++, setType: m[1].toUpperCase(), min: +m[2], max: m[3] ? +m[3] : +m[2] });
  });
  return out;
}
function calcMacros(food, amount) {
  const f = food.per === '100g' ? Number(amount) / 100 : Number(amount);
  return { kcal: r1(food.kcal * f), p: r1(food.p * f), f: r1(food.f * f), c: r1(food.c * f) };
}
function movingAvg(vals, w) {
  return vals.map((v, i) => { const from = Math.max(0, i - w + 1); let s = 0; for (let j = from; j <= i; j++) s += vals[j].value; return { date: v.date, value: r1(s / (i - from + 1)) }; });
}
function pct(n, d) { return d ? Math.round(n / d * 100) : 0; }

/* =====================================================================
   3. ストア（db があれば db、無ければメモリのモック）
   コレクション: settings, plan_days, plan_exercises, plan_meals, plan_supplements, plan_routine, foods,
                 log_weight, log_workout, log_cardio, log_meals, log_supplements, log_routine, log_media, log_daily
   ログは 1 日 1 ドキュメント（db の 5,000 ドキュメント上限対策）。
   ===================================================================== */
const COLLS = ['settings', 'plan_days', 'plan_exercises', 'plan_meals', 'plan_supplements', 'plan_routine', 'foods',
  'log_weight', 'log_workout', 'log_cardio', 'log_meals', 'log_supplements', 'log_routine', 'log_media', 'log_daily'];
const ST = { settings: Object.assign({}, DEFAULT_SETTINGS), mode: 'loading' };
COLLS.forEach(c => { if (c !== 'settings') ST[c] = {}; });

const store = {
  db: null, unsubs: [], firstLoads: 0,
  async init(db) {
    this.db = db;
    if (!db) { ST.mode = 'mock'; await seedIfEmpty(); return; }
    ST.mode = 'db';
    await new Promise(resolve => {
      let pending = COLLS.length;
      COLLS.forEach(c => {
        const u = db.collection(c).onSnapshot(snap => {
          const next = {};
          snap.docs.forEach(d => { next[d.id] = d.data(); });
          const changed = JSON.stringify(next) !== JSON.stringify(c === 'settings' ? { main: ST.settings } : ST[c]);
          if (c === 'settings') { if (next.main) ST.settings = Object.assign({}, DEFAULT_SETTINGS, next.main); }
          else ST[c] = next;
          if (pending > 0 && --pending === 0) resolve();
          else if (changed) scheduleRender();
        }, e => { toast('db エラー: ' + e.code, true); if (pending > 0 && --pending === 0) resolve(); });
        this.unsubs.push(u);
      });
    });
    await seedIfEmpty();
  },
  /** 1 ドキュメント 1 書込。ローカル状態を先に更新（楽観的）してから書く。 */
  async set(coll, id, doc) {
    const clean = JSON.parse(JSON.stringify(doc));
    if (coll === 'settings') ST.settings = Object.assign({}, DEFAULT_SETTINGS, clean); else ST[coll][id] = clean;
    if (this.db) await this.db.collection(coll).doc(id).set(clean);
  },
  async del(coll, id) {
    delete ST[coll][id];
    if (this.db) await this.db.collection(coll).doc(id).delete();
  }
};

/** plan が空なら初期データを投入。 */
async function seedIfEmpty() {
  if (Object.keys(ST.plan_days).length) return;
  for (const d of SEED.days) await store.set('plan_days', String(d.dayNo), d);
  for (const r of SEED.exercises) {
    const ex = { id: r[0], dayNo: r[1], order: r[2], nameJa: r[3], nameEn: r[4], isPreexhaust: r[5], supersetGroup: r[6],
      setScheme: r[7], howTo: r[8], videoQuery: r[9], active: true, sets: parseSetScheme(r[7]) };
    await store.set('plan_exercises', String(ex.id), ex);
  }
  for (const f of SEED.foods) await store.set('foods', f[0], { foodId: f[0], nameJa: f[1], nameEn: f[2], per: f[3], kcal: f[4], p: f[5], f: f[6], c: f[7], source: 'plan', note: '' });
  for (const m of SEED.meals) await store.set('plan_meals', String(m.mealNo), m);
  for (let i = 0; i < SEED.supplements.length; i++) { const s = SEED.supplements[i]; await store.set('plan_supplements', String(s[0]), { id: s[0], name: s[1], dose: '', timing: s[2], order: i + 1, active: true }); }
  for (const r of SEED.routine) await store.set('plan_routine', String(r.id), r);
  if (!ST.settings.seeded) await store.set('settings', 'main', Object.assign({}, ST.settings, { seeded: true }));
}
const sortedVals = (coll, key) => Object.values(ST[coll]).sort((a, b) => Number(a[key]) - Number(b[key]));

/* =====================================================================
   4. 派生モデル（読み取り専用の計算）
   ===================================================================== */
function dayDoc(date) { return ST.log_daily[date] || {}; }
function dayNoFor(date) { const d = dayDoc(date); return d.dayNo ? Number(d.dayNo) : calcDayNo(ST.settings.startDate, date); }
function planDay(date) { return ST.plan_days[String(dayNoFor(date))] || { dayNo: dayNoFor(date), name: 'Day ' + dayNoFor(date), isRest: false }; }
function isRestDay(date) { const d = dayDoc(date); return d.isRestOverride != null ? !!d.isRestOverride : !!planDay(date).isRest; }
function foodOf(id) { return ST.foods[id]; }

function latestWeightBefore(date) {
  const ds = Object.keys(ST.log_weight).filter(d => d < date).sort();
  return ds.length ? ST.log_weight[ds[ds.length - 1]] : null;
}
function waterItem() { return Object.values(ST.plan_routine).find(r => r.isWater || /^水/.test(r.name)); }
function waterMl(date) { const w = waterItem(); const l = ST.log_routine[date]; return w && l && l.items && l.items[w.id] ? Number(l.items[w.id].value) || 0 : 0; }

function mealStatusOf(m) { if (!m) return ''; return m.status || ''; }
function mealModel(date, mealNo) {
  const plan = ST.plan_meals[String(mealNo)] || { mealNo, label: mealNo + '食目', items: [] };
  const log = (ST.log_meals[date] && ST.log_meals[date].meals || {})[mealNo];
  let planKcal = 0;
  const planItems = plan.items.map(it => {
    const f = foodOf(it.foodId); const mac = f ? calcMacros(f, it.grams) : { kcal: 0, p: 0, f: 0, c: 0 };
    planKcal += mac.kcal;
    return { foodId: it.foodId, name: f ? f.nameJa : it.foodId, short: (f ? f.nameJa.replace(/[（(].*$/, '') : it.foodId) + it.grams, grams: it.grams, per: f ? f.per : '100g', kcal: mac.kcal, mac };
  });
  const items = (log && log.items || []).map((it, i) => Object.assign({ idx: i, name: (foodOf(it.foodId) || {}).nameJa || it.foodId, per: (foodOf(it.foodId) || {}).per || '100g' }, it));
  return { mealNo, label: plan.label, status: mealStatusOf(log), planItems, planKcal: r1(planKcal), items,
    kcal: r1(items.reduce((a, i) => a + (i.kcal || 0), 0)) };
}
function mealsModel(date) {
  const meals = sortedVals('plan_meals', 'mealNo').map(m => mealModel(date, m.mealNo));
  const tot = { kcal: 0, p: 0, f: 0, c: 0 }, plan = { kcal: 0, p: 0, f: 0, c: 0 };
  meals.forEach(m => { m.items.forEach(i => ['kcal', 'p', 'f', 'c'].forEach(k => { tot[k] += i[k] || 0; })); m.planItems.forEach(p => ['kcal', 'p', 'f', 'c'].forEach(k => { plan[k] += p.mac[k]; })); });
  ['kcal', 'p', 'f', 'c'].forEach(k => { tot[k] = r1(tot[k]); plan[k] = r1(plan[k]); });
  return { date, meals, total: tot, planTotal: plan, quickSubs: quickSubs() };
}
/** よく使う差替え: 過去の sub 記録から 食品×量 の頻度上位 4 件 */
function quickSubs() {
  const count = {};
  Object.values(ST.log_meals).forEach(day => Object.values(day.meals || {}).forEach(m => {
    if (m.status !== 'sub') return;
    (m.items || []).forEach(it => { const k = it.foodId + '|' + it.grams; count[k] = (count[k] || 0) + 1; });
  }));
  const out = Object.keys(count).sort((a, b) => count[b] - count[a]).slice(0, 4).map(k => {
    const [foodId, grams] = k.split('|'); const f = foodOf(foodId);
    return { foodId, grams: Number(grams), label: (f ? f.nameJa.replace(/[（(].*$/, '') : foodId) + ' ' + grams + (f && f.per === '100g' ? 'g' : '') };
  });
  if (!out.length) out.push({ foodId: 'salmon', grams: 150, label: 'サーモン 150g' });
  return out;
}

function suppsModel(date) {
  const log = (ST.log_supplements[date] || {}).items || {};
  return sortedVals('plan_supplements', 'order').filter(s => s.active !== false).map(s => {
    const l = log[s.id] || {}; return { id: s.id, name: s.name, dose: s.dose || '', timing: s.timing, done: !!l.done, time: l.time || '' };
  });
}
function routineModel(date) {
  const log = (ST.log_routine[date] || {}).items || {};
  return sortedVals('plan_routine', 'order').filter(r => r.active !== false).map(r => {
    const l = log[r.id] || {}; const isWater = !!(r.isWater || /^水/.test(r.name));
    return { id: r.id, name: r.name, timing: r.timing, isWater, done: !!l.done, time: isWater ? '' : (l.time || ''), value: l.value };
  });
}
function workoutDoc(date) { return ST.log_workout[date] || { date, sets: {}, meta: {} }; }

/** 今日画面のモデル */
function todayModel(date) {
  const s = ST.settings, pd = planDay(date), w = ST.log_weight[date] || null;
  const wo = workoutDoc(date);
  const setsDone = Object.keys(wo.sets || {}).length;
  const exCount = Object.values(ST.plan_exercises).filter(e => Number(e.dayNo) === pd.dayNo && e.active !== false).length;
  const t = { date, dayNo: pd.dayNo, dayName: pd.name, dayNotes: pd.notes || '', isRest: isRestDay(date), dayOverride: !!dayDoc(date).dayNo,
    weekNo: calcWeekNo(s.startDate, date), comment: dayDoc(date).comment || '',
    weight: w, prevWeight: latestWeightBefore(date),
    supplements: suppsModel(date), routine: routineModel(date), waterMl: waterMl(date), waterGoalMl: Number(s.waterGoalMl) || 5000,
    meals: sortedVals('plan_meals', 'mealNo').map(m => mealModel(date, m.mealNo)),
    workoutFinished: !!wo.finished, workoutFinishedTime: wo.finished || '', setsDone, exCount,
    cardio: (ST.log_cardio[date] || {}).entries || [],
    days: sortedVals('plan_days', 'dayNo') };
  const tl = buildTimeline(t);
  t.timeline = tl.steps; t.now = tl.now;
  const nm = t.meals.find(m => !m.status);
  t.nextMealNo = nm ? nm.mealNo : (t.meals.length ? t.meals[t.meals.length - 1].mealNo : 1);
  return t;
}

/** 1 日の流れ。テンプレ時刻 → 実績時刻で上書き。タイマーは前ステップの実績時刻＋待ち分。 */
function buildTimeline(t) {
  const s = ST.settings, T = s.times, steps = [];
  const latest = items => items.reduce((a, x) => x.time > a ? x.time : a, '');
  const suppGroup = timing => {
    const items = t.supplements.filter(x => x.timing === timing); if (!items.length) return null;
    const done = items.every(x => x.done);
    return { id: 'supp:' + timing, kind: 'supp_group', timing, name: 'サプリ ' + items.length + '種', time: T[timing] || T.workout, done, actualTime: done ? latest(items) : '', value: items.length + '種', items };
  };
  const routineSteps = timing => t.routine.filter(x => x.timing === timing && !x.isWater).map(x => ({ id: 'routine:' + x.id, kind: 'routine', itemId: x.id, name: x.name, time: T[timing], done: x.done, actualTime: x.done ? x.time : '', value: '' }));
  const mealStep = n => { const m = t.meals.find(x => x.mealNo === n); if (!m) return null;
    return { id: 'meal:' + n, kind: 'meal', mealNo: n, name: m.label + (m.planItems.length ? '　' + m.planItems.map(p => p.short).join('・') : ''), time: T['meal' + n] || '', done: !!m.status,
      value: m.status ? (m.status === 'skip' ? 'skip' : m.kcal + ' kcal') : (m.planKcal ? '約 ' + Math.round(m.planKcal) + ' kcal' : ''), status: m.status }; };

  steps.push({ id: 'weight', kind: 'weight', name: '体重', time: T.weight, done: !!t.weight, actualTime: t.weight ? t.weight.time : '',
    value: t.weight ? disp(t.weight.weightKg) + unit() + (t.prevWeight ? ' ' + deltaArrow(t.weight.weightKg - t.prevWeight.weightKg) : '') : '' });
  const morning = routineSteps('morning'); morning.forEach(x => steps.push(x));
  const m1 = mealStep(1);
  if (m1) { if (morning.length) m1.after = { step: morning[morning.length - 1].id, waitMin: Number(s.timerMorningMin) || 0 }; steps.push(m1); }
  const sg = suppGroup('after_meal'); if (sg) steps.push(sg);
  routineSteps('after_meal').forEach(x => { if (sg) x.after = { step: sg.id, waitMin: Number(s.timerAfterMealMin) || 0 }; steps.push(x); });
  if (!t.isRest) {
    const pre = suppGroup('pre'); if (pre) { pre.name = pre.items.map(x => x.name).join('・') + ' → 筋トレ'; steps.push(pre); }
    steps.push({ id: 'workout', kind: 'workout', name: '筋トレ Day' + t.dayNo + ' ' + t.dayName, time: T.workout, done: t.workoutFinished, actualTime: t.workoutFinishedTime, value: t.exCount + '種目' + (t.setsDone ? '・' + t.setsDone + 'set' : '') });
    ['intra', 'post'].forEach(tm => { const g = suppGroup(tm); if (g) steps.push(g); });
  }

  const ng = suppGroup('night'); if (ng) steps.push(ng);

  steps.push({ id: 'water', kind: 'water', name: '水 合計', time: T.night, done: t.waterMl >= t.waterGoalMl, actualTime: '', value: (t.waterMl / 1000).toFixed(1) + ' / ' + (t.waterGoalMl / 1000) + ' L' });

  const byId = {}; steps.forEach(x => { byId[x.id] = x; });

/** 筋トレ画面のモデル（前回値・提案重量つき） */
function workoutModel(date) {
  const s = ST.settings, dayNo = dayNoFor(date), pd = planDay(date), wo = workoutDoc(date);
  const exercises = Object.values(ST.plan_exercises).filter(e => Number(e.dayNo) === dayNo && e.active !== false).sort((a, b) => a.order - b.order);
  const allDates = Object.keys(ST.log_workout).filter(d => d < date).sort();
  const list = exercises.map(ex => {
    const isDb = /\b(DB|dumbbell)\b/i.test(ex.nameEn) || /ダンベル/.test(ex.nameJa);
    const inc = isDb ? Number(s.incDbKg) || 1 : Number(s.incBarKg) || 2;
    const prevDate = allDates.slice().reverse().find(d => Object.keys(ST.log_workout[d].sets || {}).some(k => k.startsWith(ex.id + '_'))) || '';
    const prevSets = prevDate ? ST.log_workout[prevDate].sets : {};
    const meta = (wo.meta || {})[ex.id] || {};
    const sets = (ex.sets && ex.sets.length ? ex.sets : parseSetScheme(ex.setScheme)).map(p => {
      const l = (wo.sets || {})[ex.id + '_' + p.setNo], pl = prevSets[ex.id + '_' + p.setNo];
      return { setNo: p.setNo, setType: p.setType, min: p.min, max: p.max, target: p.min === p.max ? String(p.min) : p.min + '-' + p.max,
        weightKg: l ? l.weightKg : '', reps: l ? l.reps : '', done: !!l, prevWeightKg: pl ? pl.weightKg : '', prevReps: pl ? pl.reps : '' };
    });

      videoUrl: 'https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.videoQuery || ex.nameEn || ex.nameJa),
      subName: meta.subName || '', note: meta.note || '', rpe: meta.rpe || '', prevDate, isDb, inc, sets: suggestSets(sets, inc) };
  });
  return { date, dayNo, dayName: pd.name, isRest: isRestDay(date), exercises: list, finished: !!wo.finished,
    restTopSec: Number(s.restTopSec) || 150, restOtherSec: Number(s.restOtherSec) || 90, cardio: (ST.log_cardio[date] || {}).entries || [] };
}
/** 提案: TOP=前回TOP（上限到達で+inc）／BO=TOP×0.85／DROP=直前×0.7／WU・MAIN=前回同セット（MAIN は上限到達で+inc） */
function suggestSets(sets, inc) {
  let topKg = '', prevSetKg = '';
  sets.forEach(st => {
    let w = '', reps = '', reason = '';
    const pw = st.prevWeightKg === '' ? '' : Number(st.prevWeightKg), pr = st.prevReps === '' ? '' : Number(st.prevReps);
    const bump = st.setType !== 'WU' && pw !== '' && pr !== '' && pr >= st.max;
    if (['TOP', 'MAIN', 'WU'].includes(st.setType)) {
      if (pw !== '') { w = bump ? r1(pw + inc) : pw; reason = bump ? '前回 ' + pw + '×' + pr + ' で上限到達 → +' + inc + 'kg' : '前回 ' + pw + '×' + pr; }
      else if (st.setType === 'WU' && topKg !== '') { w = Math.round(topKg * 0.5); reason = 'TOP の半分'; }
      reps = bump || pr === '' ? st.min : pr;
    } else if (st.setType === 'BO') {
      const base = topKg !== '' ? topKg : (pw !== '' ? pw / 0.85 : '');
      if (base !== '') { w = Math.round(base * 0.85); reason = 'TOP ' + r1(base) + 'kg × 0.85'; }
      reps = pr !== '' && !bump ? pr : st.min;
    } else if (st.setType === 'DROP') {
      if (prevSetKg !== '') { w = Math.round(prevSetKg * 0.7); reason = '直前 ' + prevSetKg + 'kg × 0.7'; }
      reps = st.min;
    }
    st.suggestWeightKg = w; st.suggestReps = reps; st.suggestReason = reason;
    const eff = st.weightKg !== '' ? Number(st.weightKg) : w;
    if (st.setType === 'TOP' && eff !== '') topKg = eff;
    if (eff !== '') prevSetKg = eff;

  return sets;
}

function weekAdherence(range) {

/** 自由入力「サーモン150 米150」→ 品目。foods に無いものは sample で推定して追加。 */
async function parseMealText(text) {
  const tokens = tokenizeMeal(text);
  const unknown = tokens.filter(t => !matchFood(t.name));
  if (!unknown.length) return tokens.map(t => { const f = matchFood(t.name); return Object.assign({ foodId: f.foodId, grams: t.amount }, calcMacros(f, t.amount)); });
  if (!CAP.sample) throw new Error('foods に無い食品: ' + unknown.map(u => u.name).join(', ') + '。「手入力」で追加してください');
  const catalog = Object.values(ST.foods).map(f => f.foodId + ' | ' + f.nameJa + ' | ' + f.nameEn + ' | per ' + f.per).join('\n');
  const prompt = 'You map a short Japanese/English meal note to items from a food catalog.\nCatalog (foodId | nameJa | nameEn | unit):\n' + catalog +
    '\n\nRules: numbers are grams unless the catalog unit is 1pc/1scoop (then count). Plain "米"/"rice" means cooked white rice; "鶏" means cooked chicken breast. If an item is not in the catalog, set foodId null and give typical nutrition per 100 g edible portion.\n' +
    'Reply with only a JSON array; each element: {"foodId":string|null,"nameJa":string,"nameEn":string,"amount":number,"kcal":number,"p":number,"f":number,"c":number,"note":string}. For catalog items kcal/p/f/c may be 0.\n\nNote: ' + text.trim();
  const arr = await CAP.sample.json(prompt, { modelTier: 'quick' });
  if (!Array.isArray(arr) || !arr.length) throw new Error('AI 応答が空です');
  const out = [];
  for (const p of arr) {
    let f = p.foodId && ST.foods[p.foodId];
    if (!f) f = await A.addFood({ nameJa: p.nameJa || '?', nameEn: p.nameEn || '', per: '100g', kcal: p.kcal, p: p.p, f: p.f, c: p.c, source: 'ai', note: p.note || '' });
    const amount = Number(p.amount) || 0; if (!amount) continue;
    out.push(Object.assign({ foodId: f.foodId, grams: amount }, calcMacros(f, amount)));
  }
  if (!out.length) throw new Error('量が読み取れませんでした');
  return out;
}
function tokenizeMeal(text) {
  const out = [], re = /([^\s,、，0-9０-９]+)\s*([0-9０-９]+(?:[.．][0-9０-９]+)?)\s*(g|グラム|個|枚|杯|scoop)?/g;
  const norm = String(text).replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  let m; while ((m = re.exec(norm))) out.push({ name: m[1].trim(), amount: Number(m[2]) });
  if (!out.length) throw new Error('「食品名 量」の形式で入力してください（例: サーモン150 米150）');
  return out;
}
function matchFood(name) {
  const q = String(name).toLowerCase();
  if (FOOD_ALIASES[q] && ST.foods[FOOD_ALIASES[q]]) return ST.foods[FOOD_ALIASES[q]];
  const list = Object.values(ST.foods), norm = s => String(s || '').toLowerCase().replace(/[（(].*?[）)]/g, '');
  const by = pred => list.filter(pred).sort((a, b) => norm(a.nameJa).length - norm(b.nameJa).length)[0];
  return by(f => norm(f.nameJa) === q || norm(f.nameEn) === q || f.foodId === q) || by(f => norm(f.nameJa).startsWith(q) || norm(f.nameEn).startsWith(q)) || by(f => norm(f.nameJa).includes(q) || norm(f.nameEn).includes(q)) || null;
}
/** AI で 100g あたり栄養を推定して foods に追加 */
async function estimateFoodAi(name) {
  if (!CAP.sample) throw new Error('AI 推定は使えません。手入力で追加してください');
  const est = await CAP.sample.json('Return typical nutrition per 100 g edible portion for this food (Japanese or English name). Reply with only a JSON object {"nameJa":string,"nameEn":string,"kcal":number,"p":number,"f":number,"c":number,"note":string}; p/f/c are grams; note is one short line on the assumption (cooked vs raw).\n\nFood: ' + name.trim(), { modelTier: 'quick' });
  if (!est || isNaN(Number(est.kcal))) throw new Error('AI 応答を解釈できません');
  return A.addFood({ nameJa: est.nameJa || name, nameEn: est.nameEn || '', per: '100g', kcal: est.kcal, p: est.p, f: est.f, c: est.c, source: 'ai', note: est.note || '' });
}
/** CSV エクスポート（全ログ） */
function buildCsv() {
  const rows = [['sheet', 'date', 'key', 'value']];
  const push = (sheet, date, key, obj) => rows.push([sheet, date, key, JSON.stringify(obj)]);
  Object.values(ST.log_weight).forEach(w => push('weight', w.date, '', w));
  Object.values(ST.log_workout).forEach(w => { Object.entries(w.sets || {}).forEach(([k, v]) => push('workout', w.date, k, v)); Object.entries(w.meta || {}).forEach(([k, v]) => push('workout_meta', w.date, k, v)); });
  Object.values(ST.log_cardio).forEach(c => (c.entries || []).forEach((e, i) => push('cardio', c.date, String(i), e)));
  Object.values(ST.log_meals).forEach(m => Object.entries(m.meals || {}).forEach(([k, v]) => push('meals', m.date, k, v)));
  Object.values(ST.log_supplements).forEach(s => Object.entries(s.items || {}).forEach(([k, v]) => push('supplements', s.date, k, v)));
  Object.values(ST.log_routine).forEach(s => Object.entries(s.items || {}).forEach(([k, v]) => push('routine', s.date, k, v)));
  Object.values(ST.log_media).forEach(m => push('media', m.date, m.id, m));
  Object.values(ST.log_daily).forEach(d => push('daily', d.date, '', d));
  return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
}

function firstUndone(d) { for (let i = 0; i < d.exercises.length; i++) for (let j = 0; j < d.exercises[i].sets.length; j++) if (!d.exercises[i].sets[j].done) return { ex: i, set: j }; return null; }
function firstUndoneIn(ex) { const j = ex.sets.findIndex(s => !s.done); return j < 0 ? 0 : j; }
function nextSet(d) {
  for (let i = UI.wk.ex; i < d.exercises.length; i++) { const from = i === UI.wk.ex ? UI.wk.set + 1 : 0; for (let j = from; j < d.exercises[i].sets.length; j++) if (!d.exercises[i].sets[j].done) return { ex: i, set: j }; }
  return firstUndone(d);
}

/** 依存なしスパークライン（実測 + 7 日平均） */
function spark(s1, s2) {
  if (!s1.length) return '<div class="mute small">データなし</div>';
  const W = 300, H = 80, ys = s1.concat(s2 || []).map(p => p.value);
  let mn = Math.min(...ys), mx = Math.max(...ys); if (mx === mn) { mx += 0.5; mn -= 0.5; }
  const n = s1.length, X = i => n === 1 ? W / 2 : W * i / (n - 1), Y = v => 6 + (H - 12) * (1 - (v - mn) / (mx - mn));
  const pts = s => s.map((p, i) => X(i).toFixed(1) + ',' + Y(p.value).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="体重の推移">' + (s2 && s2.length ? '<polyline fill="none" stroke="#6FCF8A" stroke-width="1.5" stroke-dasharray="3 3" points="' + pts(s2) + '"/>' : '') + '<polyline fill="none" stroke="#F2C300" stroke-width="2" points="' + pts(s1) + '"/><circle cx="' + X(n - 1).toFixed(1) + '" cy="' + Y(s1[n - 1].value).toFixed(1) + '" r="3" fill="#F2C300"/></svg>' +
    '<div class="r mute" style="font-size:12px"><span>' + esc(s1[0].date.slice(5)) + ' ' + disp(s1[0].value) + '</span><span>' + esc(s1[n - 1].date.slice(5)) + ' ' + disp(s1[n - 1].value) + ' ' + unit() + '</span></div>';
}

async function use(name) { try { return window.claude && typeof window.claude.use === 'function' ? await window.claude.use(name) : null; } catch (e) { return null; } }
async function boot() {
  try { const t = localStorage.getItem('tl.tab'); if (t && ['today', 'workout', 'meals', 'summary'].includes(t)) UI.tab = t; } catch (e) { /* ignore */ }
  render(); // 読み込み中の表示
  const db = await use('db');
  try { await store.init(db); } catch (e) { toast('初期化エラー: ' + (e.code || e.message), true); if (ST.mode !== 'mock') { ST.mode = 'mock'; await seedIfEmpty(); } }
  render();
  // 残りの capability は描画を止めずに後から有効化
  use('assets').then(a => { CAP.assets = a; scheduleRender(); });
  use('sample').then(s => { CAP.sample = s; scheduleRender(); });
  use('downloads').then(dl => { CAP.downloads = dl; scheduleRender(); });
}
window.addEventListener('beforeunload', () => { try { localStorage.setItem('tl.tab', UI.tab); } catch (e) { /* ignore */ } });
boot();
})();
</script>
