<title>トレログ</title>
<!--
  トレーニング記録アプリ（Claude Artifact 版・単一ファイル）
  公開時に宣言する capabilities:
    { db: { rules: [ { path: "", read: "owner", write: "owner" } ] }, assets: {}, sample: {}, downloads: true }
  ・db      : 全データ（オーナーのみ読み書き）。`user` capability が使えないため data/users/<uid> ではなく
              ルート直下のコレクションを rules でオーナー専用にしている（TODO: user が使えるようになったら移行）
  ・assets  : 写真・動画。db には id を保存し、表示は "/_blob/" + id
  ・sample  : AI 栄養推定（foods に無い食品）。null / 拒否時は手入力にフォールバック
  ・downloads: CSV エクスポート。null なら非表示
  db が null のとき（ローカルで開いた・権限なし）はメモリ上のモックで動く。
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#15171A; --card:#23272C; --card2:#2B3036; --ink:#F2F1EC; --mute:#8D949D; --line:#33393F;
  --yellow:#F2C300; --yellow-ink:#1A1600; --done:#6FCF8A; --warn:#E5534B;
  --num:"Barlow Condensed","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:#0E0F11;color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.5;height:100%}
body{display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.phone{width:100%;max-width:420px;min-height:100%;background:var(--bg);position:relative;
  background-image:radial-gradient(rgba(255,255,255,.055) .7px,transparent .8px);background-size:7px 7px}
main{padding:18px 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1{font:700 15px var(--jp);color:var(--mute);margin:0 0 2px;text-wrap:balance}
h1.tap{cursor:pointer}
.date{font:700 34px/1 var(--num);letter-spacing:.01em;margin:0 0 18px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.date b{color:var(--yellow);font-weight:700}
.date .nav{background:transparent;border:0;color:var(--mute);font:500 26px var(--num);padding:0 6px;line-height:1}
.mute{color:var(--mute)}.small{font-size:13px}.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.loading{text-align:center;color:var(--mute);padding:40px}
/* いま */
.now{background:var(--yellow);color:var(--yellow-ink);border-radius:14px;padding:18px 18px 16px;margin-bottom:22px;position:relative;overflow:hidden}
.now.done{background:var(--done);color:#10281A}
.now .k{font-size:13px;font-weight:700;opacity:.75;display:flex;justify-content:space-between}
.now .t{font:700 26px/1.15 var(--jp);margin:6px 0 4px}
.now .s{font-size:14px;opacity:.85}
.now .timer{font:700 54px/1 var(--num);margin:10px 0 4px;letter-spacing:.02em}
.now .btns{display:flex;gap:8px;margin-top:12px}
.now button{width:100%;border:0;border-radius:10px;padding:14px;background:var(--yellow-ink);color:var(--yellow);font:700 17px var(--jp)}
.now.done button{background:#10281A;color:var(--done)}
.now button.alt{background:rgba(26,22,0,.15);color:var(--yellow-ink);flex:0 0 34%}
.now .w-in{background:rgba(26,22,0,.12);margin-top:10px}
.now .w-in input{color:var(--yellow-ink)}
.now .w-in .u,.now .w-in input::placeholder{color:rgba(26,22,0,.55)}
/* タイムライン */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.step{position:relative;margin-bottom:12px}
.step:before{content:"";position:absolute;left:-23px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--card2);border:2px solid var(--line)}
.step.done:before{background:var(--done);border-color:var(--done)}
.step.cur:before{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 0 4px rgba(242,195,0,.25)}
.step .row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card);cursor:pointer}
.step.done .row{background:var(--card);color:var(--mute)}
.step.done .nm{color:var(--mute)}
.step .body{flex:1;min-width:0}
.step .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.step .nm{font-weight:700}
.step .tm{font:500 14px var(--num);color:var(--mute);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-left:10px;flex:0 0 auto;min-width:56px}
.step .l2{font-size:13px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere;white-space:normal;word-break:break-word}
.step .l3{font:500 13px var(--num);color:var(--mute);margin-top:2px;overflow-wrap:anywhere;white-space:normal}
.step .nm{overflow-wrap:anywhere;white-space:normal}
.step.done .l3{color:var(--done)}
.step.cur .row{outline:1px solid rgba(242,195,0,.35)}
.step.future .row{opacity:.6}
.step .chk{margin-top:2px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:16px;flex:none;padding:0}
.chk.on{background:var(--done);border-color:var(--done);color:#10281A}
.chk.sub{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.chk.skip{background:transparent;border-color:var(--warn);color:var(--warn);font-weight:700}
.chk.na{background:transparent;border-color:var(--line);color:var(--mute);font-weight:700}
.lbl-sub.na{background:var(--card2);color:var(--mute)}
.b.small{font-size:13px;padding:8px 10px;color:var(--mute);background:transparent;border:1px solid var(--line)}
.step.handled .row{opacity:.75}
.step .tm{text-align:right;line-height:1.2}
.step .tm b{font-size:16px;color:var(--ink);line-height:1}
.step .tm b.late{color:var(--yellow)}
.step .tm small{display:block;font-size:11px;color:var(--mute);opacity:.85}
.step.done .tm b{color:var(--ink)}
.step .tm.edit{cursor:pointer;text-decoration:underline dotted}
.lbl-sub{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.lbl-sub.sub{background:rgba(242,195,0,.18);color:var(--yellow)}
.lbl-sub.skip{background:rgba(229,83,75,.18);color:var(--warn)}
.photo{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.photo img.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:var(--card2);aspect-ratio:auto}
.photo .est{margin-top:10px}
.photo .est .it{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.photo .est .it .nm{cursor:pointer;text-decoration:underline dotted}
.photo .est .it .g{display:flex;align-items:center;gap:4px;font:600 14px var(--num)}
.photo .est .it .g button{width:30px;height:30px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:7px;font:700 16px var(--num);padding:0}
.photo .est .it .m{grid-column:1 / -1;font:500 12px var(--num);color:var(--mute)}
.photo .est .it.off{opacity:.4;text-decoration:line-through}
.conf{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.conf.high{background:rgba(111,207,138,.18);color:var(--done)}.conf.medium{background:rgba(242,195,0,.18);color:var(--yellow)}.conf.low{background:rgba(229,83,75,.18);color:var(--warn)}
.cam{font-size:16px;margin-left:4px;cursor:pointer}
.dlg{z-index:30;align-items:center}
.dlg .sheet-body{border-radius:14px;max-width:360px;padding:18px}
.dlg .msg{font-size:14px;color:var(--mute);margin:6px 0 14px;white-space:pre-line}
input.time{width:100%;font:700 34px var(--num);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--ink)}
/* 体重入力 */
.w-in{display:flex;align-items:baseline;gap:8px;background:var(--card);border-radius:10px;padding:10px 12px}
.w-in input{background:transparent;border:0;color:var(--ink);font:700 34px var(--num);width:120px;outline:none;padding:0;min-width:0}
.w-in input.bf{width:84px;font-size:22px}
.w-in .u{color:var(--mute)}
.w-in input::placeholder{color:var(--mute);opacity:.7}
/* カード・ボタン */
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
.card .ttl{font-weight:700}
.items{color:var(--mute);font-size:13px;margin:4px 0 10px}
.btns{display:flex;gap:8px}
.btns button,.b{flex:1;border:0;border-radius:9px;padding:12px;font:700 15px var(--jp)}
.b-main{background:var(--done);color:#10281A}
.b-sub{background:var(--card2);color:var(--ink)}
.b-yel{background:var(--yellow);color:var(--yellow-ink)}
.b-ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:none;padding:8px 12px;font-size:13px;border:0;border-radius:9px;background:var(--card2);color:var(--ink);font-weight:700}
.chips button.on{background:var(--yellow);color:var(--yellow-ink)}
.chips button.ok{color:var(--done)}
.chips button.skip{color:var(--warn)}
input.txt,select.txt,textarea.txt{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:400 14px var(--jp);outline:none}
input.txt:focus,textarea.txt:focus,button:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
textarea.txt{min-height:60px}
.row2{display:flex;gap:8px;align-items:center}
.row2 > *{flex:1}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border-bottom:0}
.list .it .m{color:var(--mute);font:500 13px var(--num);white-space:nowrap}
.list .it .x{background:transparent;border:0;color:var(--warn);font-size:18px;padding:0 6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--card2);color:var(--mute)}
.badge.ok{background:rgba(111,207,138,.18);color:var(--done)}
.badge.warn{background:rgba(242,195,0,.18);color:var(--yellow)}
.badge.bad{background:rgba(229,83,75,.18);color:var(--warn)}
/* 筋トレ */
.ex-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.ex-head .p{font:500 13px var(--num);color:var(--mute);white-space:nowrap}
.ex-head .p button{background:transparent;border:0;color:var(--mute);font:700 18px var(--num);padding:0 8px}
.ex-name{font:700 24px/1.2 var(--jp);margin:0 0 2px}
.ex-en{color:var(--mute);font-size:13px;margin-bottom:14px}
.ex-en a,.ex-en u{color:var(--mute);cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--yellow);color:var(--yellow-ink);margin:0 6px 8px 0}
.tag.ss{background:var(--card2);color:var(--ink)}
.dropfig{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font:700 16px var(--num)}.dropfig .arr{color:var(--mute);font:600 12px var(--jp)}.dropfig .hot{color:var(--yellow)}
.rep-ta{width:100%;min-height:260px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;box-sizing:border-box}
.cmp-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.cmp-row:last-child{border-bottom:0}.cmp-row .v{color:var(--mute);text-align:right;white-space:nowrap}
.wbig{font-size:64px;line-height:1;margin:6px 0 2px}.wbig small{font-size:24px;color:var(--mute)}.wbig.ok{color:var(--green)}.wstat{font-weight:700;color:var(--mute)}.wstat.ok{color:var(--green);font-size:20px}
.ac-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ac-row:last-child{border-bottom:0}.ac-name{font-weight:700}
.tag.sub{background:var(--warn);color:#fff}
.howto{background:var(--card);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute);margin-bottom:12px}
.cur-set{border:2px solid var(--yellow);border-radius:12px;padding:12px 14px;margin:12px 0;background:rgba(242,195,0,.06)}
.cur-set .k{font-size:11px;font-weight:700;color:var(--yellow);letter-spacing:.06em}
.cur-set .n{font:700 20px var(--jp);margin:2px 0}
.cur-set .p{font-size:14px;color:var(--ink);opacity:.9}
.setrows{margin:0 0 14px;border-radius:10px;overflow:hidden;background:var(--card)}
.setrows .sr{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.setrows .sr:last-child{border-bottom:0}
.setrows .sr .mk{width:18px;text-align:center;font:700 14px var(--num);color:var(--mute)}
.setrows .sr.done .mk{color:var(--done)}
.setrows .sr.done{color:var(--mute)}
.setrows .sr.cur{background:rgba(242,195,0,.14)}
.setrows .sr.cur .mk{color:var(--yellow)}
.setrows .sr .nm{flex:1}
.setrows .sr .rv{font:600 14px var(--num);color:var(--done);white-space:nowrap}
.setrows .sr.cur .rv{color:var(--yellow)}
.quick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:-4px 0 14px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font:700 15px var(--num)}
.wu-prog{font:700 15px var(--num);color:var(--yellow);margin:-6px 0 10px;text-align:center}
.wu{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
.wu.done{outline:2px solid var(--done)}
.wu .nm{font:700 19px var(--jp)}
.wu .en{font-size:12px;color:var(--mute);margin-bottom:8px}
.wu .anim{width:100%;height:160px;display:block;border-radius:10px;background:var(--card2)}
.wu ol{margin:10px 0 6px;padding-left:22px;font-size:14px}
.wu ol li{margin:2px 0}
.wu .vid{font-size:13px;color:var(--mute)}
.wu .vid a{color:var(--mute)}
.wu .cnt{display:flex;align-items:center;gap:10px;margin-top:10px}
.wu .cnt .sc{font:700 22px var(--num);min-width:82px}
.wu .cnt .sc.ok{color:var(--done)}
.wu .cnt .sc.half{color:var(--yellow)}
.wu .cnt button{flex:1;border:0;border-radius:9px;padding:12px;font:700 15px var(--jp);background:var(--card2);color:var(--ink)}
.wu .cnt button.b-yel{background:var(--yellow);color:var(--yellow-ink)}
.wu .cnt .undo{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--mute);padding:10px 12px}
/* 棒人間: 線はアクセント色。CSS アニメでループ */
.fig{stroke:#F2C300;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .hd{fill:#F2C300;stroke:none}
.fig .dim{stroke:#a6890a}
@keyframes swing{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(55deg)}}
@keyframes swingB{0%,100%{transform:rotate(55deg)}50%{transform:rotate(-55deg)}}
@keyframes crossL{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(30deg)}}
@keyframes crossR{0%,100%{transform:rotate(95deg)}50%{transform:rotate(-30deg)}}
@keyframes circle{0%{transform:rotate(0)}50%{transform:rotate(360deg)}100%{transform:rotate(0)}}
@keyframes hips{0%{transform:translate(0,0)}25%{transform:translate(14px,-5px)}50%{transform:translate(0,-10px)}75%{transform:translate(-14px,-5px)}100%{transform:translate(0,0)}}
@keyframes toe{0%,100%{transform:rotate(0)}50%{transform:rotate(85deg)}}
.a-swing .armL,.a-swing .armR{transform-origin:100px 58px;animation:swing 1.6s ease-in-out infinite}
.a-alt .armL{transform-origin:100px 58px;animation:swing 1.6s ease-in-out infinite}
.a-alt .armR{transform-origin:100px 58px;animation:swingB 1.6s ease-in-out infinite}
.a-cross .armL{transform-origin:82px 58px;animation:crossL 1.8s ease-in-out infinite}
.a-cross .armR{transform-origin:118px 58px;animation:crossR 1.8s ease-in-out infinite}
.a-circle .armL,.a-circle .armR{transform-origin:100px 58px;animation:circle 4s linear infinite}
.a-hips .pelvis{animation:hips 2.4s linear infinite}
.a-toe .upper{transform-origin:100px 100px;animation:toe 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.fig *{animation-duration:0s!important}}
/* 食事シート: ソフト削除・チェック */
.list .it.del{opacity:.45;text-decoration:line-through}
.list .it .cb{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:transparent;color:transparent;font-size:15px;flex:none;padding:0}
.list .it .cb.on{background:var(--done);border-color:var(--done);color:#10281A}
.list .it .un{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:4px 8px;font-size:12px;white-space:nowrap}
.pending{background:rgba(242,195,0,.14);border:1px solid var(--yellow);border-radius:9px;padding:10px;margin-top:10px;font-size:14px}
.pending .btns{margin-top:8px}
.toast button{margin-left:12px;background:var(--yellow);color:var(--yellow-ink);border:0;border-radius:7px;padding:4px 10px;font:700 13px var(--jp);pointer-events:auto}
.toast.act{pointer-events:auto}
.bar{height:10px;border-radius:999px;background:var(--card2);overflow:hidden;margin:6px 0}
.bar > div{height:100%;background:var(--yellow);border-radius:999px}
.bar.ok > div{background:var(--done)}
.hist{width:100%;border-collapse:collapse;font:500 13px var(--num);font-variant-numeric:tabular-nums}
.hist th{font:600 11px var(--jp);color:var(--mute);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.hist td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.hist td.ok{color:var(--done)}.hist td.ng{color:var(--mute)}
.glossary dt{font-weight:700;margin-top:10px}.glossary dd{margin:2px 0 0;color:var(--mute);font-size:13px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big .cell{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center}
.big .lbl{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;padding:0 4px}
.big .lbl i{font-style:normal}
.big .val{font:700 56px/1 var(--num);margin:8px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.big .val.empty{color:var(--mute)}
.big .pm{display:flex;gap:8px}
.big .pm button{flex:1;border:0;border-radius:10px;padding:14px 0;background:var(--card2);color:var(--ink);font:700 24px var(--num)}
.ghost{color:var(--mute);font-size:13px;text-align:center;margin:-4px 0 14px}
.ghost b{color:var(--ink);font-family:var(--num);font-size:15px}
.done-btn{width:100%;border:0;border-radius:12px;padding:18px;background:var(--yellow);color:var(--yellow-ink);font:700 20px var(--jp)}
.done-btn.green{background:var(--done);color:#10281A}
.rest{background:var(--card);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
.rest .n{font:700 64px/1 var(--num);color:var(--yellow);font-variant-numeric:tabular-nums}
.rest .l{color:var(--mute);font-size:13px}
.rest button{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 16px;font:600 14px var(--jp)}
.mini{display:flex;gap:8px;margin-top:14px}
.mini button{flex:1;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:10px;font:500 13px var(--jp)}
/* 週 */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat div{background:var(--card);border-radius:10px;padding:12px}
.stat .n{font:700 30px/1 var(--num);font-variant-numeric:tabular-nums}
.stat .n span{font-size:16px;color:var(--mute)}
.stat .l{font-size:12px;color:var(--mute);margin-top:4px}
.spark{background:var(--card);border-radius:10px;padding:12px;margin-bottom:14px}
.spark .h{font-size:13px;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between}
.spark svg{width:100%;height:80px;display:block}
.spark .r{display:flex;justify-content:space-between;font:600 14px var(--num);padding:3px 0}
.spark .r.up span:last-child{color:var(--done)}
.spark .r.mute{color:var(--mute)}
.report{background:var(--card2);border-radius:10px;padding:12px;font:500 12px/1.6 ui-monospace,Menlo,monospace;color:var(--mute);white-space:pre-wrap;user-select:all}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:6px 0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--card2);display:block}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;font:500 11px var(--num);padding:2px 6px;background:rgba(0,0,0,.6);color:#fff}
/* タブ */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:#0E0F11;border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;background:transparent;border:0;color:var(--mute);font:600 12px var(--jp);padding:6px 0}
.tabs button.on{color:var(--yellow)}
.tabs button .ic{display:block;font:700 18px var(--num);margin-bottom:2px}
.tabs button .sub{display:block;opacity:.8}
/* トースト・シート */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--card2);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--warn);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet-body{background:var(--card);width:100%;max-width:420px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-body h3{margin:0 0 10px;font:700 17px var(--jp)}
.lbl{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.note{font-size:12px;color:var(--mute);margin-top:18px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.mode{font-size:12px;color:var(--yellow-ink);background:var(--yellow);text-align:center;margin:-8px 0 12px;padding:4px 8px;border-radius:6px;font-weight:700}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

  const topParts = sm.topSets.map(t => { const cur = t.points.filter(p => inRange(p.date)).sort((p, q) => q.value - p.value || q.reps - p.reps)[0]; if (!cur) return null; const pv = t.points.filter(p => p.date >= prev.start && p.date <= prev.end).sort((p, q) => q.value - p.value)[0]; return t.name + ' ' + (pv ? disp(pv.value) + '→' : '') + disp(cur.value) + u + '×' + (cur.reps || '?'); }).filter(Boolean);
  const subList = Object.keys(a.meals.subFoods).map(id => ((ST.foods[id] || {}).nameEn || (ST.foods[id] || {}).nameJa || id) + ' x' + a.meals.subFoods[id]);
  const notes = [];
  sm.missed.forEach(m => notes.push(m.date.slice(5).replace('-', '/') + ' ' + m.itemEn + ' missed (' + m.reasonEn + ')'));
  Object.keys(ST.log_daily).filter(inRange).sort().forEach(d => { const c = (ST.log_daily[d].comment || '').trim(); if (c) notes.push(c); if (ST.log_daily[d].warmupSkipped) notes.push('warm-up skipped ' + d.slice(5) + ' (' + ST.log_daily[d].warmupSkipped.reason + ')'); });
  Object.keys(ST.log_workout).filter(inRange).sort().forEach(d => Object.entries(ST.log_workout[d].meta || {}).forEach(([id, m]) => { if (m.note) notes.push(((ST.plan_exercises[id] || {}).nameEn || '') + ': ' + m.note); }));
  const form = sm.media.filter(m => m.category === 'form'), body = sm.media.filter(m => m.category === 'body');
  const link = (label, items, via) => via ? label + ': sent via Messenger' : label + ': ' + (items.length ? items.map(m => m.url || ('/_blob/' + m.assetId)).join(' ') : 'none');
  const tl = []; let onTime = 0, logged = 0; sm.days.forEach(x => x.times.forEach(tm => { if (!tm.logged) return; logged++; if (!tm.late) onTime++; else tl.push(x.date.slice(5) + ' ' + tm.title + ' ' + tm.logged + ' (plan ' + tm.planned + ')'); }));
  const timeLine = 'Timing: ' + onTime + '/' + logged + ' logged within 60 min of plan' + (tl.length ? '; late: ' + tl.join(', ') : '');
  return ['Week ' + sm.weekNo + ' (' + shortRange(r.start, r.end) + ') Report', wLine,
    'Workouts: ' + a.workouts.done + '/' + a.workouts.planned + ' done, Warm-up: ' + a.warmup.done + '/' + a.warmup.planned + ', Cardio: ' + a.cardio.done + '/' + a.cardio.planned + (a.cardio.minutes ? ' (' + a.cardio.minutes + ' min)' : ''),
    'Heaviest sets: ' + (topParts.length ? topParts.join(' / ') : 'n/a'),
    'Meals: ' + a.meals.onPlan + '/' + a.meals.planned + ' on plan' + (a.meals.subs ? ' (' + a.meals.subs + ' subs: ' + subList.join(', ') + ')' : '') + (a.meals.skips ? ' (' + a.meals.skips + ' skipped)' : '') + (sm.photoMeals ? ' (photo-logged: ' + sm.photoMeals + ', estimated values marked ※)' : ''),
    'Supplements: ' + a.supplements.pct + '%', 'Water: ' + a.water.ok + '/' + a.water.days + ' days ≥ ' + (Number(ST.settings.waterGoalMl) / 1000) + 'L',
    timeLine, 'Notes: ' + (notes.length ? notes.join('; ') : 'none'), link('Form check videos', form, opts.formViaMessenger), link('Body photos', body, false)].join('\n');
}

  async addWater(date, delta) { const next = Math.max(0, waterMl(date) + delta); const cur = ST.log_daily[date] || { date }; await store.set('log_daily', date, Object.assign({ date }, cur, { waterMl: next, waterLoggedAt: isoNow() })); return next; },
  /** 記録済み時刻の手修正: ステップ種別ごとに該当ドキュメントの loggedAt を書き換える */

  /** 品目配列から食事ドキュメントを作って保存（履歴に積む） */
  mealCommit(date, n, items, extra) { const cur = (ST.log_meals[date] && ST.log_meals[date].meals || {})[n] || null; mealHistPush(date, n, cur);
    const clean = items.map(({ foodId, grams, kcal, p, f, c, origin, eaten, deleted, planGrams, estimated }) => Object.assign({ foodId, grams, kcal, p, f, c, origin: origin || 'add', eaten: eaten !== false, deleted: !!deleted, planGrams: planGrams == null ? '' : planGrams }, estimated ? { estimated: true } : {}));
    const doc = Object.assign({ variant: cur ? cur.variant || '' : '', loggedAt: (cur && cur.loggedAt) || isoNow(), photo: cur ? cur.photo || null : null }, extra || {}, { items: clean });
    const st = deriveStatus(clean); doc.status = st === 'sub' ? (doc.photo && clean.some(i => i.estimated && !i.deleted && i.eaten) ? 'photo' : 'substitute') : st; doc.photoId = doc.photo && doc.photo.assetId ? doc.photo.assetId : ''; doc.reason = doc.skip ? (doc.skip.reasonText || doc.skip.reason) : '';

    return planToItems(src, opt.choices).map(i => Object.assign(i, { origin: 'plan', eaten: true, planGrams: i.grams })); },
  /** プラン通り（variant:'alt' で代替案、choices で「または」の選択） */
  mealPlanDone(date, n, opt) { opt = opt || {}; return A.mealCommit(date, n, A.planLogItems(n, opt), { variant: opt.variant || '' }); },
  mealHalf(date, n) { const cur = mealModel(date, n); return A.mealCommit(date, n, cur.items.map(i => { if (i.deleted || i.origin !== 'plan') return i; const g = r1(Number(i.planGrams) / 2), f = ST.foods[i.foodId]; return Object.assign({}, i, { grams: g, eaten: true }, f ? calcMacros(f, g) : {}); })); },
  mealSkip(date, n, reason, reasonText) { const cur = mealModel(date, n); return A.mealCommit(date, n, cur.items.filter(i => i.origin === 'plan').map(i => Object.assign({}, i, { eaten: false, deleted: false })), { skip: { reason: reason || '食べなかった', reasonText: reasonText || '' } }); },
  /** 記録を取り消す → 未記録（ドキュメントから削除）。履歴に積むので「元に戻す」できる */
  mealCancel(date, n) { const cur = (ST.log_meals[date] && ST.log_meals[date].meals || {})[n] || null; mealHistPush(date, n, cur); return A.setMeal(date, n, null).then(() => A.syncDaily(date)); },

  mealToggleEaten(date, n, idx) { const cur = mealModel(date, n); return A.mealCommit(date, n, cur.items.map(i => i.idx === idx ? Object.assign({}, i, { eaten: !i.eaten }) : i)); },
  mealSetChoice(date, n, planFoodId, foodId) { const cur = mealModel(date, n), f = foodOf(foodId); const pi = ((ST.plan_meals[String(n)] || {}).items || []).find(it => it.foodId === planFoodId) || {}; const g = (pi.choiceGrams || {})[foodId] || pi.grams; return A.mealCommit(date, n, cur.items.map(i => { if (i.origin !== 'plan' || (i.choiceOf || i.foodId) !== planFoodId) return i; return Object.assign({}, i, { foodId: resolveFoodId(foodId), choiceOf: planFoodId }, g ? { grams: g, planGrams: g } : {}, calcMacros(f, g || i.grams)); })); },
  mealSoftDelete(date, n, idx, flag) { const cur = mealModel(date, n); return A.mealCommit(date, n, cur.items.map(i => i.idx === idx ? Object.assign({}, i, { deleted: !!flag }) : i)); },

  /** 追加 or 置き換え。戻り値は「何をしたか」の一文 */

    newItems.forEach(ni => { const hit = mode === 'replace' ? items.find(i => !i.deleted && i.foodId === ni.foodId) : null;
      if (hit) { msgs.push(itemShort(hit) + ' → ' + itemShort(ni) + ' に置き換え'); items = items.map(i => i === hit ? Object.assign({}, i, ni, { eaten: true, deleted: false }) : i); }
      else { msgs.push(itemShort(ni) + ' を追加'); items.push(Object.assign({ origin: 'add', eaten: true, deleted: false, planGrams: '' }, ni)); } });

  async addFood(food) { let id = food.foodId || String(food.nameEn || food.nameJa).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'food'; if (ST.foods[id]) id += '_' + Date.now().toString(36);

  async deleteSet(date, exId, setNo) { const doc = workoutDoc(date), sets = Object.assign({}, doc.sets); delete sets[exId + '_' + setNo]; await store.set('log_workout', date, Object.assign({}, doc, { sets })); },

  async finishWorkout(date) { const doc = workoutDoc(date); if (!doc.finished) { const at = isoNow(); await store.set('log_workout', date, Object.assign({}, doc, { finished: fmtHm(at), finishedAt: at })); } },
  /** ウォームアップ: 「1セット完了」ごとに保存（sets{id:n}）。初回で startedAt を記録 */
  async warmupSet(date, id, delta) { const doc = workoutDoc(date), w = Object.assign({ sets: {} }, doc.warmup); w.sets = Object.assign({}, w.sets); const target = (ST.plan_warmup[String(id)] || {}).targetSets || 3;
    w.sets[id] = Math.max(0, Math.min(target, (Number(w.sets[id]) || 0) + delta)); if (!w.startedAt) w.startedAt = Date.now(); w.skipped = false; await store.set('log_workout', date, Object.assign({}, doc, { warmup: w })); },

  async addMedia(m) { const id = (m.date + '_' + Date.now().toString(36)).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_'); await store.set('log_media', id, Object.assign({ id, loggedAt: isoNow() }, m)); return id; },
  async setSuppDose(id, dose) { const cur = ST.plan_supplements[String(id)]; if (!cur) throw new Error('サプリがありません'); await store.set('plan_supplements', String(id), Object.assign({}, cur, { dose, pending: !dose })); },
  async saveSettings(patch) { await store.set('settings', 'main', Object.assign({}, ST.settings, patch)); }
};
/** 食事の操作履歴（画面内、食事ごと最大 20 手） */
const MEAL_HIST = {};
function mealHist(date, n) { const k = date + '#' + n; return MEAL_HIST[k] = MEAL_HIST[k] || []; }
function mealHistPush(date, n, cur) { const st = mealHist(date, n); st.push(cur ? JSON.parse(JSON.stringify(cur)) : null); if (st.length > 20) st.shift(); }
async function parseMealText(text) {

function buildCsv() {

/** 写真で記録パネル（状態: pick → ready → analyzing → done / error） */

      h += '<div class="btns" style="margin-top:10px"><button class="b-main" id="phSave">この内容で記録</button></div><div class="btns" style="margin-top:8px"><button class="b-sub" id="phEst">もう一度推定</button><button class="b-sub" id="phManual">手入力に切替</button></div>';

}
async function estimateMealPhotoWith(ph) {

/** 体重スパークライン。欠測日は線でつながず点を飛ばす（隣り合う日だけ線で結ぶ）。s2 は 7 日平均（同じ規則） */
function spark(s1, s2) {
  if (!s1.length) return '<div class="mute small">データなし</div>';
  const W = 300, H = 80, ys = s1.concat(s2 || []).map(p => p.value); let mn = Math.min(...ys), mx = Math.max(...ys); if (mx === mn) { mx += 0.5; mn -= 0.5; }
  const d0 = s1[0].date, span = Math.max(1, diffDays(d0, s1[s1.length - 1].date));
  const X = date => span === 0 ? W / 2 : W * diffDays(d0, date) / span, Y = v => 6 + (H - 12) * (1 - (v - mn) / (mx - mn));
  const segs = series => { const out = []; let cur = []; series.forEach((p, i) => { if (i > 0 && diffDays(series[i - 1].date, p.date) !== 1) { if (cur.length) out.push(cur); cur = []; } cur.push(p); }); if (cur.length) out.push(cur); return out; };
  const draw = (series, cls, stroke, dash) => segs(series).map(seg => seg.length === 1 ? '<circle class="' + cls + '" data-date="' + seg[0].date + '" data-v="' + seg[0].value + '" cx="' + X(seg[0].date).toFixed(1) + '" cy="' + Y(seg[0].value).toFixed(1) + '" r="2.5" fill="' + stroke + '"/>' : '<polyline class="' + cls + '" fill="none" stroke="' + stroke + '" stroke-width="' + (dash ? 1.5 : 2) + '"' + (dash ? ' stroke-dasharray="3 3"' : '') + ' points="' + seg.map(p => X(p.date).toFixed(1) + ',' + Y(p.value).toFixed(1)).join(' ') + '"/>').join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="体重の推移">' + (s2 && s2.length ? draw(s2, 'ma', '#6FCF8A', true) : '') + draw(s1, 'w', '#F2C300', false) + s1.map(p => '<circle class="pt" data-date="' + p.date + '" data-v="' + p.value + '" cx="' + X(p.date).toFixed(1) + '" cy="' + Y(p.value).toFixed(1) + '" r="2.5" fill="#F2C300"/>').join('') + (s2 || []).map(p => '<circle class="mapt" data-date="' + p.date + '" data-v="' + p.value + '" cx="' + X(p.date).toFixed(1) + '" cy="' + Y(p.value).toFixed(1) + '" r="1.5" fill="#6FCF8A"/>').join('') + '</svg><div class="r mute" style="font-size:12px"><span>' + esc(s1[0].date.slice(5)) + ' ' + disp(s1[0].value) + '</span><span>' + esc(s1[s1.length - 1].date.slice(5)) + ' ' + disp(s1[s1.length - 1].value) + ' ' + unit() + '</span></div>';
}
